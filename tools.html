      save();
      if (silent !== true) renderAll();
    }

    // ---------------------------------------------------------------
    // UI HELPERS
    // ---------------------------------------------------------------
    // Sources sit behind a small "why?" so the screen stays short
    // "Reason ¦ Source": the reason is the short note, the source goes underneath
    function why(ref) {
      if (!ref) return '';
      const i = ref.indexOf(' ¦ '), r = i >= 0 ? ref.slice(0, i) : '', src = i >= 0 ? ref.slice(i + 3) : ref;
      return `<details class="why"><summary>why?</summary><div class="why-body">${r ? `<div class="why-r">${esc(r)}</div>` : ''}${src ? `<div class="why-s">Source: ${esc(src)}</div>` : ''}</div></details>`;
    }
    function heading(text, extra) { return `<div class="flex items-center justify-between gap-2 mt-6 mb-2"><h2 class="text-xs font-semibold uppercase tracking-wider text-coffee-400">${text}</h2>${extra || ''}</div>`; }
    function chip(label, on, onclick, sub) {
      return `<button type="button" onclick="${onclick}" class="chip ${on ? 'chip-on' : ''} ${sub ? 'text-left' : ''}">${esc(label)}${sub ? `<span class="block text-xs ${on ? 'text-white/80' : 'text-coffee-400'} font-normal">${esc(sub)}</span>` : ''}</button>`;
    }
    function tick(ok, text, ref) {
      return `<div class="flex gap-2.5 items-start py-1.5"><span class="mt-0.5 w-5 h-5 flex-shrink-0 rounded-full border flex items-center justify-center ${ok ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-coffee-600'}">${ok ? '<i data-lucide="check" class="w-3.5 h-3.5"></i>' : ''}</span><div class="inline-why text-[15px] ${ok ? 'text-emerald-200' : 'text-coffee-100'}">${text}${why(ref)}</div></div>`;
    }
    function firstBlock(hours, mode) {
      const i = hours.findIndex(h => h.mode === mode);
      if (i < 0) return null;
      let j = i;
      while (j + 1 < hours.length && hours[j + 1].mode === mode) j++;
      return { start: hours[i].t, end: hours[j].t + HOUR };
    }

    // ---------------------------------------------------------------
    // TODAY
    // ---------------------------------------------------------------
    function locationHtml() {
      return `<div class="card space-y-3">
        <div class="flex items-center gap-2 text-white font-semibold text-lg"><i data-lucide="map-pin" class="w-5 h-5 text-amber-400"></i> Where is the mill?</div>
        <p class="text-[15px] text-coffee-300">The forecast needs the mill's location once. Do this at the mill.</p>
        <button onclick="useMyLocation()" class="btn-big"><i data-lucide="locate" class="w-5 h-5"></i> Use my location</button>
        <details><summary class="text-sm text-coffee-300 underline cursor-pointer">Type it in instead</summary>
          <div class="grid grid-cols-2 gap-2 mt-2">
            <input id="latIn" type="number" step="any" inputmode="decimal" placeholder="Latitude" class="field-lg">
            <input id="lonIn" type="number" step="any" inputmode="decimal" placeholder="Longitude" class="field-lg">
          </div>
          <button onclick="saveLatLon()" class="btn-big ghost mt-2">Save</button>
        </details>
        ${wxStatus ? `<p class="text-sm text-amber-300">${esc(wxStatus)}</p>` : ''}
      </div>`;
    }
    function saveLatLon() {
      const lat = num(document.getElementById('latIn').value), lon = num(document.getElementById('lonIn').value);
      if (lat == null || lon == null) { wxStatus = 'Enter both numbers.'; renderAll(); return; }
      state.settings.mill.lat = lat; state.settings.mill.lon = lon;
      state.weather = null; wxCache = null; wxStatus = '';
      save(); fetchWeather();
    }

    function weatherHtml() {
      if (state.settings.mill.lat == null) return locationHtml();
      const w = wx();
      if (!w) {
        return `<div class="card text-[15px] text-coffee-300 space-y-2"><p>${wxStatus === 'loading' ? 'Getting the forecast…' : 'No forecast yet.'}</p>
          ${wxStatus.startsWith('error') ? '<p class="text-sm text-rose-300">Could not reach the weather service. Try again when there is signal.</p>' : ''}
          ${wxStatus === 'loading' ? '' : '<button onclick="fetchWeather()" class="btn-big ghost">Try again</button>'}</div>`;
      }
      const now = Date.now();
      const cur = w.hours.find(h => h.t <= now && h.t + HOUR > now) || w.hours[0];
      const next24 = w.hours.filter(h => h.t + HOUR > now && h.t < now + 24 * HOUR);
      const rain = firstBlock(next24, 'cover'), sun = firstBlock(next24, 'shade');
      const sum = wxSummary(72);
      const age = hoursBetween(state.weather.fetchedAt, new Date());
      const lines = [];
      lines.push(rain ? `<span class="text-sky-300 font-semibold">Rain likely ${esc(when(rain.start))}–${esc(hm(rain.end))}.</span> Pile and cover before it starts.` : 'No rain expected in the daytime over the next 24 hours.');
      if (sun) lines.push(`Strong sun ${esc(when(sun.start))}–${esc(hm(sun.end))}${state.settings.setup.shade ? ': shade cloth on.' : '.'}`);
      return `<div class="card space-y-3">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-xl mode-${cur.mode} flex items-center justify-center text-white flex-shrink-0"><i data-lucide="${{ open: 'sun', shade: 'cloud-sun', slow: 'cloud', cover: 'cloud-rain', night: 'moon' }[cur.mode]}" class="w-6 h-6"></i></div>
          <div class="min-w-0"><div class="text-lg font-bold text-white leading-tight">${cur.day ? 'Now: ' + MODE_LABEL[cur.mode].toLowerCase() : 'Night'}</div><div class="text-[15px] text-coffee-300">${esc(MODE_ACTION[cur.mode])}</div></div>
          <div class="ml-auto text-right text-white font-semibold">${fmt(cur.temp)}°<div class="text-xs text-coffee-400 font-normal">${fmt(cur.rh)}% RH</div></div>
        </div>
        ${lines.map(t => `<p class="text-[15px] text-coffee-100">${t}</p>`).join('')}
        <div>
          <div class="flex gap-px rounded-md overflow-hidden">${next24.map(h => `<div class="flex-1 h-5 mode-${h.mode}" title="${esc(h.hh + ' ' + MODE_LABEL[h.mode])}"></div>`).join('')}</div>
          <div class="flex justify-between text-[10px] font-mono text-coffee-400 mt-0.5"><span>now</span><span>+12 h</span><span>+24 h</span></div>
          <div class="flex flex-wrap gap-x-3 gap-y-1 mt-1 text-[11px] text-coffee-300">${['open', 'shade', 'slow', 'cover', 'night'].map(k => `<span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-sm mode-${k}"></span>${MODE_LABEL[k]}</span>`).join('')}</div>
        </div>
        <details>
          <summary class="text-[15px] text-coffee-100 cursor-pointer">Next ${sum.n} days: <span class="text-emerald-300">${sum.good} good</span>, <span class="text-amber-300">${sum.fair} fair</span>, <span class="text-sky-300">${sum.poor} poor</span> for drying <span class="text-coffee-400 underline text-sm">show</span></summary>
          <div class="grid grid-cols-4 sm:grid-cols-5 gap-1.5 mt-2">${sum.days.map(d => `<div class="rounded-lg border p-1.5 text-center ${d.outlook === 'good' ? 'border-emerald-500/40 bg-emerald-500/10' : d.outlook === 'fair' ? 'border-amber-500/40 bg-amber-500/10' : 'border-sky-500/40 bg-sky-500/10'}">
            <div class="text-[11px] text-coffee-300">${esc(new Date(d.sunrise).toLocaleDateString([], { weekday: 'short' }) + ' ' + new Date(d.sunrise).getDate())}</div>
            <div class="text-xs font-semibold ${d.outlook === 'good' ? 'text-emerald-300' : d.outlook === 'fair' ? 'text-amber-300' : 'text-sky-300'}">${d.outlook}</div>
            <div class="text-[10px] text-coffee-400">${fmt(d.ppMax)}% rain</div></div>`).join('')}</div>
          <div class="inline-why text-xs text-coffee-400 mt-2">Good: 6+ drying hours and at most 1 rain hour. Poor: under 3 drying hours or 4+ rain hours.${why('A day\'s rating counts the daylight hours that are good for drying and the hours with rain, from the hourly forecast. The cut-offs are my own, and you can change them under More, Where the numbers come from. ¦ Tool heuristic')}</div>
        </details>
        <div class="flex items-center justify-between text-xs text-coffee-400"><span>Updated ${fmt(age, age < 1 ? 1 : 0)} h ago · <a class="underline" href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (CC BY 4.0)</span><button onclick="fetchWeather()" class="flex items-center gap-1 underline"><i data-lucide="refresh-cw" class="w-3 h-3"></i> Refresh</button></div>
        ${wxStatus.startsWith('error') ? '<p class="text-xs text-rose-300">Could not refresh. Showing the last forecast.</p>' : ''}
      </div>`;
    }

    function reminderCard(r, showLot) {
      const now = Date.now();
      const late = r.at < now - 15 * 60000;
      const label = r.kind === 'ph' ? 'Log pH' : r.kind === 'moisture' ? 'Log it' : r.kind === 'drystart' ? 'Open' : 'Done';
      return `<div class="flex items-center gap-3 p-3 rounded-xl border ${late ? 'border-amber-500/50 bg-amber-500/10' : 'border-coffee-800 bg-coffee-900/60'}">
        <i data-lucide="${REM_ICON[r.kind] || 'bell'}" class="w-5 h-5 flex-shrink-0 ${late ? 'text-amber-300' : 'text-coffee-300'}"></i>
        <div class="flex-1 min-w-0">
          <div class="text-[15px] text-white leading-snug">${esc(r.text)}</div>
          <div class="text-xs ${late ? 'text-amber-300' : 'text-coffee-400'}">${r.at <= now + 5 * 60000 ? (late ? 'was due ' + esc(hm(r.at)) : 'now') : esc(when(r.at))}${showLot ? ` · ${esc(r.lot.code)}` : ''}</div>
          ${why(r.ref)}
        </div>
        <button onclick="doneReminder('${r.lot.id}','${r.kind}')" class="btn ${r.at <= now + 2 * HOUR ? 'btn-primary' : 'btn-ghost'} !px-3.5 !py-2 !text-sm flex-shrink-0">${label}</button>
      </div>`;
    }

    function lotStatus(l) {
      const st = lotStage(l);
      if (st === 'fermenting') {
        const fr = fermentReady(l);
        if (fr.ready) return { text: fr.needHand ? 'Ready to wash' : 'Ready to dry', cls: 'text-emerald-300' };
        return { text: `Fermenting ${fmt(fermentHours(l))} h · ${fr.last && fr.last.ph != null ? 'pH ' + fmt(fr.last.ph, 2) : 'no pH yet'}`, cls: 'text-amber-300' };
      }
      if (st === 'to dry') return { text: 'Washed, waiting to dry', cls: 'text-amber-300' };
      if (st === 'drying') {
        const di = dryingInfo(l);
        if (di.ready) return { text: 'Dry: bag it', cls: 'text-emerald-300' };
        const day = Math.floor((Date.now() - new Date(l.drying.startAt)) / DAY) + 1;
        return { text: `Drying, day ${day}${di.estNow != null ? ` · about ${fmt(di.estNow)}%` : ''}`, cls: 'text-cyan-300' };
      }
      return { text: `Bagged, resting ${fmt((Date.now() - new Date(l.bag.at)) / DAY)} days`, cls: 'text-coffee-300' };
    }
    function lotRow(l) {
      const s = lotStatus(l);
      const bad = lotAlerts(l).some(a => a.tone === 'red');
      return `<button onclick="openLot('${l.id}')" class="row-btn">
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2"><span class="font-semibold text-white">${esc(l.code)}</span>${bad ? '<span class="w-2 h-2 rounded-full bg-rose-500"></span>' : ''}${l.sample ? '<span class="text-[10px] text-coffee-500 border border-coffee-700 rounded px-1">sample</span>' : ''}</div>
          <div class="text-sm text-coffee-300 truncate">${esc(l.method)} · ${esc(l.cultivar || '–')} · ${fmt(l.cherryKg)} kg</div>
          <div class="text-sm ${s.cls}">${esc(s.text)}</div>
        </div>
        <i data-lucide="chevron-right" class="w-5 h-5 text-coffee-500"></i>
      </button>`;
    }

    function renderToday() {
      const rs = allReminders(36);
      const now = Date.now();
      const soon = rs.filter(r => r.at <= now + 2 * HOUR), later = rs.filter(r => r.at > now + 2 * HOUR);
      const active = state.lots.filter(l => lotStage(l) !== 'resting' && !l.sample);
      let html = weatherHtml();
      if (!state.lots.length) {
        html += `<div class="card mt-6 space-y-3 text-center">
          <p class="text-lg text-white font-semibold">No lots yet</p>
          <p class="text-[15px] text-coffee-300">When cherry comes in, tap New lot. The app asks a few questions, suggests a process, then reminds you what to do and tells you when it's ready.</p>
          <button onclick="startWizard()" class="btn-big"><i data-lucide="plus" class="w-5 h-5"></i> New lot</button>
          <button onclick="loadSamples()" class="text-sm text-coffee-300 underline">Or look around with sample lots</button>
        </div>`;
        return html;
      }
      html += heading('To do now');
      html += soon.length ? `<div class="space-y-2">${soon.map(r => reminderCard(r, true)).join('')}</div>` : `<p class="text-[15px] text-coffee-300">Nothing right now.${later.length ? ` Next: ${esc(later[0].text.toLowerCase())}, ${esc(when(later[0].at))}.` : ''}</p>`;
      if (later.length) html += `<details class="mt-3"><summary class="text-sm text-coffee-300 underline cursor-pointer">Later (${later.length})</summary><div class="space-y-2 mt-2">${later.map(r => reminderCard(r, true)).join('')}</div></details>`;
      html += heading('Lots in progress', `<button onclick="setTab('lots')" class="text-sm text-coffee-300 underline">All lots</button>`);
      html += active.length ? `<div class="space-y-2">${active.map(lotRow).join('')}</div>` : '<p class="text-[15px] text-coffee-300">None. Every lot is bagged.</p>';
      html += `<button onclick="startWizard()" class="btn-big mt-4"><i data-lucide="plus" class="w-5 h-5"></i> New lot</button>`;
      return html;
    }

    // ---------------------------------------------------------------
    // NEW LOT: cultivar, process, timeline
    // ---------------------------------------------------------------
    let wiz = null;
    const WIZ_STEPS = ['Cultivar and farm', 'Process', 'Your timeline'];
    function newDraft() {
      return {
        farmer: '', masl: null, cultivar: '', cherryKg: null,
        pickedAt: toLocalInput(new Date(Date.now() - 4 * HOUR)), arrivedAt: toLocalInput(new Date()),
        container: 'baskets', crushed: false, warm: false, ripeness: 'ripe', counts: {}, experiment: false,
        method: '', culture: 'none', dose: null, labelDose: null, product: '', vessel: 'barrel', surface: '', checklist: {}, notes: '', recipeId: null,
      };
    }
    function draftInput(d) {
      return Object.assign({}, d, { pickedAt: d.pickedAt ? new Date(d.pickedAt) : null, arrivedAt: new Date() });
    }
    function startWizard() { wiz = { step: 0, d: newDraft(), err: '' }; setTab('new'); }
    // Typing doesn't re-render, so the keyboard stays open
    function wset(k, v) { wiz.d[k] = v; }
    function wpick(k, v) { wiz.d[k] = v; renderAll(); }
    function wcheck(k, v) { wiz.d.checklist[k] = v; }
    function pickCultivar(i) { wiz.d.cultivar = state.cultivars[i].name; renderAll(); }
    function wnext() {
      const d = wiz.d;
      wiz.err = '';
      if (wiz.step === 0 && (d.masl == null || !d.cultivar)) wiz.err = 'Enter the farm altitude and pick a cultivar.';
      if (!wiz.err) {
        wiz.step++;
        if (wiz.step === 1 && !d.method) { const sg = suggest(draftInput(d)); d.method = (sg.ranked[0] || { id: 'Washed' }).id; }
        if (!d.surface) d.surface = surfaceOptions()[0];
      }
      renderAll(); window.scrollTo({ top: 0 });
    }
    function pickProcess(id) { wiz.d.method = id; wiz.d.recipeId = null; renderAll(); }
    function useRecipe(rid) {
      const r = state.recipes.find(x => x.id === rid); if (!r) return;
      Object.assign(wiz.d, { method: r.process, culture: r.culture || 'none', dose: r.dose ?? null, product: r.product || '', recipeId: r.id, surface: r.surface || surfaceOptions()[0] });
      wiz.step = 2; renderAll(); window.scrollTo({ top: 0 });
    }
    function wsetCulture(v) {
      wiz.d.culture = v;
      if (cultureOf(v).needsDose && wiz.d.dose == null) wiz.d.dose = V('doseGPerKg');
      renderAll();
    }

    function renderWizard() {
      if (!wiz) wiz = { step: 0, d: newDraft(), err: '' };
      const d = wiz.d, s = wiz.step;
      let html = `<div class="flex gap-1.5 mb-4">${WIZ_STEPS.map((_, i) => `<div class="h-1.5 flex-1 rounded-full ${i <= s ? 'bg-amber-500' : 'bg-coffee-800'}"></div>`).join('')}</div>
        <div class="text-xs text-coffee-400 mb-1">Step ${s + 1} of ${WIZ_STEPS.length}</div>
        <h2 class="text-2xl font-bold text-white mb-2">${WIZ_STEPS[s]}</h2>`;
      const next = (label) => `${wiz.err ? `<p class="text-sm text-rose-300 mt-4">${esc(wiz.err)}</p>` : ''}<button onclick="wnext()" class="btn-big mt-6">${label || 'Next'} <i data-lucide="arrow-right" class="w-5 h-5"></i></button>`;

      if (s === 0) {
        const known = state.cultivars.some(c => c.name === d.cultivar);
        const ripe = [['ripe', 'Mostly ripe'], ['mixed', 'Mixed'], ['early', 'Early picking'], ['late', 'Late picking']];
        html += `<label class="q">Cultivar</label>
          <div class="flex flex-wrap gap-2">${state.cultivars.map((c, i) => chip(c.name, d.cultivar === c.name, `pickCultivar(${i})`)).join('')}</div>
          <input value="${known ? '' : esc(d.cultivar)}" oninput="wset('cultivar', this.value.trim())" placeholder="Or type another" class="field-lg mt-2">
          <label class="q">Farm altitude</label>
          <div class="relative"><input type="number" inputmode="numeric" value="${d.masl ?? ''}" oninput="wset('masl', num(this.value))" placeholder="e.g. 1400" class="field-lg pr-12"><span class="absolute right-4 top-1/2 -translate-y-1/2 text-coffee-400">m</span></div>
          <label class="q">Cherry <span class="opt">(optional, for the yeast dose)</span></label>
          <div class="relative"><input type="number" inputmode="decimal" step="0.1" value="${d.cherryKg ?? ''}" oninput="wset('cherryKg', num(this.value))" placeholder="e.g. 300" class="field-lg pr-12"><span class="absolute right-4 top-1/2 -translate-y-1/2 text-coffee-400">kg</span></div>
          <details class="mt-4 card"><summary class="text-[15px] text-coffee-100 cursor-pointer">More about this cherry <span class="opt">(optional)</span></summary>
            <div class="space-y-1">
              <label class="q">Farmer or farm</label><input value="${esc(d.farmer)}" oninput="wset('farmer', this.value.trim())" class="field-lg">
              <label class="q">Picked at</label><input type="datetime-local" value="${esc(d.pickedAt)}" oninput="wset('pickedAt', this.value)" class="field-lg">
              <label class="q">Came in</label>
              <div class="flex flex-wrap gap-2">${chip('Baskets', d.container === 'baskets', "wpick('container','baskets')")}${chip('Sacks', d.container === 'sacks', "wpick('container','sacks')")}${chip('Other', d.container === 'other', "wpick('container','other')")}</div>
              <div class="space-y-2 pt-2">
                <label class="chk-lg"><input type="checkbox" ${d.crushed ? 'checked' : ''} onchange="wset('crushed', this.checked)"> Some cherry is crushed or leaking</label>
                <label class="chk-lg"><input type="checkbox" ${d.warm ? 'checked' : ''} onchange="wset('warm', this.checked)"> It feels warm</label>
              </div>
              <label class="q">Ripeness</label>
              <div class="flex flex-wrap gap-2">${ripe.map(([v, l]) => chip(l, d.ripeness === v, `wpick('ripeness','${v}')`)).join('')}</div>
            </div>
          </details>
          ${next()}`;
      }
      if (s === 1) {
        const sg = suggest(draftInput(d));
        const c = cultureOf(d.culture);
        if (sg.recipes.length) {
          html += `<div class="card border-emerald-500/50 space-y-2 mt-3"><div class="text-sm font-semibold text-emerald-300">You've done this before</div>
            ${sg.recipes.map(r => `<div class="text-[15px] text-coffee-100">${esc(r.process)} from ${esc(r.fromLot)} (${fmt(r.masl)} m): stopped at pH ${fmt(r.phEnd, 2)}, dried ${fmt(r.dryDays)} days to ${fmt(r.finalMoisture, 1)}%.${r.flavor ? ` Tasted: ${esc(r.flavor)}.` : ''}
              <button onclick="useRecipe('${r.id}')" class="btn-big ghost mt-2">Use this recipe</button></div>`).join('')}</div>`;
        }
        const warn = sg.general.filter(n => n.tone === 'amber' || n.tone === 'red');
        if (warn.length) html += `<div class="space-y-2 mt-3">${notesHtml(warn)}</div>`;
        html += `<div class="space-y-2 mt-3">`;
        sg.ranked.forEach((r, i) => {
          const on = d.method === r.id;
          const main = r.notes.find(n => n.tone === 'amber' || n.tone === 'red') || r.notes[0];
          html += `<button onclick="pickProcess('${esc(r.id)}')" class="w-full text-left rounded-xl border p-4 ${on ? 'border-amber-500 bg-amber-500/10' : 'border-coffee-800 bg-coffee-900/60'}">
            <div class="flex items-center gap-3"><span class="w-5 h-5 rounded-full border-2 flex-shrink-0 ${on ? 'border-amber-500 bg-amber-500' : 'border-coffee-600'}"></span><span class="text-lg font-bold text-white flex-1">${esc(r.id)}</span>${i === 0 ? '<span class="text-xs font-semibold bg-amber-500 text-white rounded-full px-2 py-0.5">Suggested</span>' : !r.ok ? '<span class="text-xs text-amber-300">risky now</span>' : ''}</div>
            ${main ? `<div class="text-sm mt-1 ml-8 ${main.tone === 'amber' || main.tone === 'red' ? 'text-amber-200' : 'text-coffee-300'}">${esc(main.text)}</div>` : ''}
          </button>${on ? glossHtml(r.id) : ''}`;
        });
        html += `</div><button onclick="wpick('experiment', ${!d.experiment})" class="text-sm text-coffee-300 underline mt-3">${d.experiment ? 'Hide' : 'Show'} sealed and anaerobic options</button>`;
        html += `<label class="q">Starter or wild?</label>
          <div class="grid grid-cols-2 gap-2">${chip('Wild', !c.needsDose && !c.warn, "wsetCulture('none')", 'No culture added')}${chip('Starter culture', c.needsDose || !!c.warn, "wsetCulture('rehydrate')", 'Yeast or bacteria')}</div>`;
        if (d.culture !== 'none') {
          const plan = computePlan({ kg: d.cherryKg, yeast: d.culture, dose: d.dose, container: d.vessel });
          html += `<div class="card mt-3 space-y-3">
            <select onchange="wsetCulture(this.value)" class="field-lg">${CULTURES.filter(x => x.id !== 'none').map(x => `<option value="${x.id}" ${d.culture === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
            ${d.culture === 'lalcafe' ? lalcafeHtml(d.product) : ''}
            <input value="${esc(d.product)}" oninput="wset('product', this.value)" placeholder="Product name (optional)" class="field-lg">
            ${c.needsDose ? `<div class="relative"><input type="number" step="0.1" inputmode="decimal" value="${d.dose ?? ''}" onchange="wset('dose', num(this.value)); renderAll()" class="field-lg pr-16"><span class="absolute right-4 top-1/2 -translate-y-1/2 text-coffee-400">g/kg</span></div>
              ${d.cherryKg ? `<div class="text-sm">${planHtml(plan)}</div>` : '<p class="text-sm text-coffee-400">Enter the kg on the first screen to get grams and mixing steps.</p>'}
              <div class="inline-why text-sm text-coffee-400">Check the dose on your product's label.${why(explain(resolve('doseGPerKg')))}</div>` : ''}
            ${c.warn ? notesHtml([note('red', "Baker's and beer yeast tend to give cheesy or sulphur notes in coffee.", 'They are bred for dough or grain, not acidic fruit with little oxygen, so they get stressed and make sulphur compounds. ¦ Lucia Solis: Producer Toolkit #3')]) : ''}
          </div>`;
        }
        html += `<label class="q">Dries on</label>
          <div class="flex flex-wrap gap-2">${surfaceOptions().map(x => chip(x, d.surface === x, `wpick('surface', ${esc(JSON.stringify(x))})`)).join('')}</div>`;
        if (sg.cultivar && (sg.cultivar.flavor || sg.cultivar.optMin != null)) {
          html += `<details class="mt-4"><summary class="text-sm text-coffee-300 underline cursor-pointer">About ${esc(sg.cultivar.name)}</summary>
            <div class="text-sm text-coffee-200 mt-2 space-y-1">${sg.cultivar.optMin != null ? `<p>Best from ${fmt(sg.cultivar.optMin)}${sg.cultivar.optMax ? '–' + fmt(sg.cultivar.optMax) : '+'} m (your entry from World Coffee Research).</p>` : ''}${sg.cultivar.flavor ? `<p>${esc(sg.cultivar.flavor)}.${why(sg.cultivar.flavorRef)}</p>` : ''}</div></details>`;
        }
        html += next('See the timeline');
      }
      if (s === 2) {
        const m = methodOf(d.method);
        const recipe = d.recipeId ? state.recipes.find(r => r.id === d.recipeId) : null;
        const c = cultureOf(d.culture);
        html += `<p class="text-[15px] text-coffee-300">${esc(d.cultivar)} · ${fmt(d.masl)} m · ${esc(d.method)} · ${c.id === 'none' ? 'wild' : esc(d.product || 'starter culture')} <button onclick="wiz.step=1;renderAll()" class="underline ml-1">change</button></p>`;
        html += roadmapHtml(roadmap({ method: d.method, culture: d.culture, product: d.product, dose: d.dose, kg: d.cherryKg, surface: d.surface, start: Date.now(), recipe }), null);
        html += flavourHtml({ method: d.method, culture: d.culture, cultivar: d.cultivar }) + recordHtml(null, d.method);
        if (m.tank) {
          html += `<details class="card mt-6"><summary class="text-[15px] text-coffee-100 cursor-pointer">Before you start: tank checklist</summary>
            <div class="space-y-2 mt-3">${[['water', 'Water is not chlorinated'], ['clean', 'Tanks and tools are clean'], ['soap', 'No scented soap'], ['calib', 'pH meter calibrated (4 and 7)'], ['smell', 'No smoke, fuel or kitchen smells nearby']].map(([k, t]) => `<label class="chk-lg"><input type="checkbox" ${d.checklist[k] ? 'checked' : ''} onchange="wcheck('${k}', this.checked)"> ${t}</label>`).join('')}</div>
            <div class="inline-why text-xs text-coffee-400 mt-1">${why('Chlorine kills the microbes, dirty tanks carry over the wrong ones, coffee soaks up soap and smoke smells, and an uncalibrated meter gives wrong readings. ¦ Lucia Solis: Producer Toolkit #3 and #7')}</div>
          </details>`;
        }
        html += `<button onclick="saveLot()" class="btn-big mt-6"><i data-lucide="play" class="w-5 h-5"></i> Start this lot</button>
          <p class="text-sm text-coffee-400 mt-2">Starting saves the lot, so the app can remind you at each step. Logging readings is optional.</p>`;
      }
      return html;
    }

    function saveLot() {
      const d = wiz.d;
      const n = state.lots.filter(l => !l.sample).length + 1;
      const now = new Date().toISOString();
      const m = methodOf(d.method);
      const lot = {
        id: uid('l'), code: `LOT-${new Date().getFullYear()}-${String(n).padStart(3, '0')}`, createdAt: now,
        farmer: d.farmer, farm: '', masl: d.masl, cultivar: d.cultivar, cherryKg: d.cherryKg,
        pickedAt: d.pickedAt ? new Date(d.pickedAt).toISOString() : null, arrivedAt: now,
        container: d.container, crushed: d.crushed, warm: d.warm, ripeness: d.ripeness, counts: d.counts,
        method: d.method, experiment: d.experiment, culture: d.culture, product: d.product, dose: cultureOf(d.culture).needsDose ? d.dose : null, vessel: d.vessel,
        checklist: d.checklist, notes: d.notes, recipeId: d.recipeId || null, surface: d.surface,
        fermentStart: m.tank ? now : null, readings: [], actions: [], bag: null,
        drying: m.tank ? null : { startAt: now, surface: d.surface || surfaceOptions()[0], target: V('moistureTarget'), weighings: [] },
      };
      state.lots.push(lot);
      wiz = null;
      openLot(lot.id);
    }

    // ---------------------------------------------------------------
    // LOTS
    // ---------------------------------------------------------------
    function openLot(id) { state.selectedId = id; state.openForm = null; save(); setTab('lot'); }
    function toggleForm(k) { state.openForm = state.openForm === k ? null : k; renderAll(); }

    function renderLots() {
      const real = state.lots.filter(l => !l.sample).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      const samples = state.lots.filter(l => l.sample);
      const going = real.filter(l => lotStage(l) !== 'resting'), done = real.filter(l => lotStage(l) === 'resting');
      let html = `<button onclick="startWizard()" class="btn-big"><i data-lucide="plus" class="w-5 h-5"></i> New lot</button>`;
      if (!state.lots.length) html += `<p class="text-[15px] text-coffee-300 mt-4">No lots yet. <button onclick="loadSamples()" class="underline">Look around with sample lots</button></p>`;
      if (going.length) html += heading('In progress') + `<div class="space-y-2">${going.map(lotRow).join('')}</div>`;
      if (done.length) html += heading('Bagged') + `<div class="space-y-2">${done.map(lotRow).join('')}</div>`;
      if (samples.length) html += heading('Sample lots', '<button onclick="removeSamples()" class="text-sm text-coffee-300 underline">Remove</button>') + `<div class="space-y-2">${samples.map(lotRow).join('')}</div>`;
      return html;
    }

    function renderLot() {
      const l = lotById(state.selectedId);
      if (!l) return renderLots();
      const st = lotStage(l), m = methodOf(l.method);
      const alerts = lotAlerts(l).filter(a => a.tone !== 'green');
      const urgent = alerts.filter(a => a.tone === 'red'), watch = alerts.filter(a => a.tone !== 'red');
      let html = `<div>
        <div class="flex items-center gap-2"><h2 class="text-2xl font-bold text-white">${esc(l.code)}</h2>${l.sample ? '<span class="text-xs text-coffee-400 border border-coffee-700 rounded px-1.5">sample</span>' : ''}</div>
        <p class="text-[15px] text-coffee-300">${esc(l.method)} · ${esc(l.cultivar || '–')} · ${fmt(l.cherryKg)} kg${l.masl ? ` · ${fmt(l.masl)} m` : ''}${l.farmer || l.farm ? ` · ${esc(l.farmer || l.farm)}` : ''}</p>
      </div>`;
      if (urgent.length) html += `<div class="space-y-2 mt-4">${notesHtml(urgent)}</div>`;
      html += heading('Roadmap') + roadmapHtml(lotRoadmap(l), l);
      html += flavourHtml({ method: l.method, culture: l.culture, cultivar: l.cultivar, lot: l }) + recordHtml(l);
      if (watch.length) html += heading('Watch out') + `<div class="space-y-2">${notesHtml(watch)}</div>`;
      const rems = lotReminders(l, 36).filter(r => r.kind !== 'ph' && r.kind !== 'moisture');
      if (rems.length) html += heading('Coming up') + `<div class="space-y-2">${rems.slice(0, 5).map(r => reminderCard(r, false)).join('')}</div>`;
      html += historyHtml(l);
      html += `<details class="mt-4"><summary class="text-sm text-coffee-300 underline cursor-pointer">More</summary><div class="card mt-2 space-y-3">
        ${l.notes ? `<p class="text-sm text-coffee-300 whitespace-pre-line">${esc(l.notes)}</p>` : ''}
        <button onclick="deleteLot('${l.id}')" class="text-sm text-rose-300 underline">Delete this lot</button>
      </div></details>`;
      return html;
    }

    function fermentCard(l, bare) {
      const S = state.settings;
      const fr = fermentReady(l);
      const rs = readingsOf(l);
      const ready = fr.ready;
      const open = state.openForm === 'ph';
      let html = bare ? `<div class="text-sm text-coffee-300 mb-2">Fermenting for ${fmt(fermentHours(l))} h</div>` : heading(`Fermenting · ${fmt(fermentHours(l))} h`);
      html += `<div class="card space-y-3">`;
      if (ready) html += `<div class="rounded-xl bg-emerald-500/15 border border-emerald-500/50 p-3 text-emerald-200 text-[15px] font-semibold">${fr.needHand ? 'Ready. Wash it now.' : 'Ready. Take it out and start drying.'}</div>`;
      html += `<div><div class="text-sm text-coffee-400 mb-1">Ready when</div>
        ${tick(fr.ph, `pH is ${fr.end.v} or lower${fr.last && fr.last.ph != null ? ` <span class="text-coffee-400">(last: ${fmt(fr.last.ph, 2)})</span>` : ''}`, explain(fr.end))}
        ${fr.needHand ? tick(fr.hand, 'Hand test: the parchment feels gritty, like pebbles', 'Rub and rinse a few beans. When the mucilage is fully broken down they make a grating noise and feel gritty. Stop then to avoid over-fermenting. ¦ Schwan & Fleet 2014, ch. 10') : ''}</div>`;
      html += open ? `<form onsubmit="addReading(event,'${l.id}')" class="space-y-3 border-t border-coffee-800 pt-3">
          <div class="grid grid-cols-2 gap-2"><div><div class="text-sm text-coffee-300 mb-1">pH</div><input name="ph" type="number" step="0.01" inputmode="decimal" class="field-lg" autofocus></div>
          ${S.thermometer ? '<div><div class="text-sm text-coffee-300 mb-1">Tank °C</div><input name="temp" type="number" step="0.1" inputmode="decimal" class="field-lg"></div>' : ''}</div>
          ${S.extraInstruments ? '<div class="grid grid-cols-2 gap-2"><input name="brix" type="number" step="0.1" placeholder="Brix °Bx" class="field-lg"><input name="psi" type="number" step="0.1" placeholder="Pressure PSI" class="field-lg"></div>' : ''}
          <input name="smell" placeholder="How does it smell? (optional)" class="field-lg">
          ${fr.needHand ? '<label class="chk-lg"><input name="hand" type="checkbox"> Hand test passed: gritty, like pebbles</label>' : ''}
          <details><summary class="text-sm text-coffee-400 underline cursor-pointer">Different time?</summary><input name="at" type="datetime-local" value="${toLocalInput(new Date())}" class="field-lg mt-2"></details>
          <div class="grid grid-cols-2 gap-2"><button type="button" onclick="toggleForm('ph')" class="btn-big ghost">Cancel</button><button class="btn-big">Save</button></div>
        </form>` : `<button onclick="toggleForm('ph')" class="btn-big ${ready ? 'ghost' : ''}"><i data-lucide="test-tube" class="w-5 h-5"></i> Log pH</button>`;
      html += `<button onclick="finishFermentation('${l.id}')" class="btn-big ${ready ? '' : 'ghost'}"><i data-lucide="droplets" class="w-5 h-5"></i> ${fr.needHand ? 'Washed. Start drying' : 'Done. Start drying'}</button>`;
      if (rs.length >= 2) html += lineChart(rs.map(r => ({ x: fermentHours(l, r), y: r.ph })), { title: 'pH', color: '#F59E0B', dp: 1, lines: [{ y: fr.end.v, label: `ready at ${fr.end.v}`, color: '#34D399' }] });
      const next = lotReminders(l, 48).find(r => r.kind === 'ph');
      if (next && !open) html += `<div class="inline-why text-sm text-coffee-400">Next pH check: ${esc(when(next.at))}.${why(next.ref)}</div>`;
      return html + '</div>';
    }

    // ---------------------------------------------------------------
    // ROADMAP: every step from sorting to bagging, with what to do,
    // how you know it's done, and dates where the forecast allows
    // ---------------------------------------------------------------
    // Sourced planning ranges. A saved recipe replaces them.
    function fermentRange(m, recipe) {
      if (recipe && recipe.fermentH) return { lo: recipe.fermentH, hi: recipe.fermentH, ref: `Your own lot took this long, so the timeline uses it. ¦ Your recipe from ${recipe.fromLot}` };
      if (m.sealed) return { lo: 36, hi: V('maxHoursSealed'), ref: `The shortest sealed lot in the roaster notes ran 36 h. ${explainR(resolve('maxHoursSealed'))} ¦ Seven Seeds lot page; ${srcLabel(resolve('maxHoursSealed'))}` };
      return { lo: 6, hi: 72, ref: 'Open fermentations take 6–72 h depending on temperature: warm mills and thick mucilage finish fast, cold mills slow. ¦ Schwan & Fleet 2014, ch. 10' };
    }
    function dryRange(m, surface, recipe) {
      if (recipe && recipe.dryDays) { const d = Math.round(recipe.dryDays); return { lo: d, hi: d, ref: `Your own lot dried in this many days, so the timeline uses it. ¦ Your recipe from ${recipe.fromLot}` }; }
      if (m.drying === 'parchment') return /raised|bed/i.test(surface || '') ? { lo: 5, hi: 10, ref: 'Air moves under raised beds, so parchment dries in 5–10 days depending on the weather. ¦ Schwan & Fleet 2014, ch. 10' } : { lo: 7, hi: 15, ref: 'On patios, parchment takes 7–15 days depending on the weather. ¦ Schwan & Fleet 2014, ch. 10' };
      return { lo: 12, hi: 21, ref: `Whole cherries hold far more water, so they take 12–21 days on patios. Lucia\'s shaded naturals took about 15.${m.drying === 'honey' ? ' A honey can be even slower than a natural.' : ''} ¦ Schwan & Fleet 2014, ch. 10; Making Coffee #71${m.drying === 'honey' ? '; Producer Toolkit #2' : ''}` };
    }
    // What roasters say other mills did for this process, India and Nepal first
    function otherMills(method, field, max) {
      const cat = methodOf(method).ref;
      const lots = ROASTER_LOTS.filter(x => x.p === cat && x[field] !== 'Not stated');
      const near = lots.filter(x => x.o === 'India' || x.o === 'Nepal');
      return near.concat(lots.filter(x => !near.includes(x))).slice(0, max || 3).map(x => [`${x.r}, ${x.o}: ${x[field]}`, x.u]);
    }
    function shortDate(t) { const d = new Date(t); return `${d.toLocaleDateString([], { weekday: 'short' })} ${d.getDate()} ${d.toLocaleDateString([], { month: 'short' })}`; }

    // p: { method, culture, product, dose, kg, surface, start (ms), lot (optional), recipe (optional) }
    function roadmap(p) {
      const S = state.settings, m = methodOf(p.method), l = p.lot, c = cultureOf(p.culture);
      const parchment = m.drying === 'parchment';
      const R = k => resolve(k);
      const now = Date.now();
      const t0 = p.start;
      const d0 = new Date(t0); d0.setHours(0, 0, 0, 0);
      const dayN = t => Math.floor((t - d0.getTime()) / DAY);
      const span = (a, b) => { const x = dayN(a), y = dayN(b); return { days: x === y ? `Day ${x}` : `Day ${x}–${y}`, dates: x === y ? shortDate(a) : `${shortDate(a)} – ${shortDate(b)}` }; };
      const starter = c.id === 'none' ? '' : p.product || { rehydrate: 'dry yeast', lalcafe: 'LalCafé yeast', activate: 'dry yeast', direct: 'direct-pitch culture', lab: 'lactic bacteria', baker: "baker's yeast" }[c.id];
      const doseText = c.needsDose ? (p.kg ? `${fmt((p.dose ?? V('doseGPerKg')) * p.kg)} g (${fmt(p.dose ?? V('doseGPerKg'), 2)} g/kg)` : `${fmt(p.dose ?? V('doseGPerKg'), 2)} g/kg`) : '';
      const stages = [];

      // Times: real ones from the lot where they exist, sourced ranges otherwise
      const fr = fermentRange(m, p.recipe), dr = dryRange(m, p.surface || (l && l.drying && l.drying.surface), p.recipe);
      const fStart = l ? new Date(l.fermentStart || l.createdAt).getTime() : t0;
      let fe = null;
      if (m.tank) {
        if (l && l.washedAt) fe = [new Date(l.washedAt).getTime(), new Date(l.washedAt).getTime()];
        else fe = [Math.max(fStart + fr.lo * HOUR, l ? now : 0), Math.max(fStart + fr.hi * HOUR, l ? now : 0)];
      }
      const ds = l && l.drying ? [new Date(l.drying.startAt).getTime(), new Date(l.drying.startAt).getTime()] : m.tank ? fe : [t0, t0];
      let de, deFromWeights = false;
      if (l && l.bag) de = [new Date(l.bag.at).getTime(), new Date(l.bag.at).getTime()];
      else {
        const di = l && l.drying ? dryingInfo(l) : null;
        if (di && di.eta) { de = [di.eta.getTime(), di.eta.getTime()]; deFromWeights = true; }
        else de = [ds[0] + dr.lo * DAY, ds[1] + dr.hi * DAY];
        if (l && l.drying) de = [Math.max(de[0], now), Math.max(de[1], now)];
      }

      // 1. Sort
      const sort = { key: 'sort', title: m.drying === 'cherry' ? 'Sort the cherry' : 'Sort and pulp', ...span(t0, t0), todo: [], done: [] };
      sort.todo.push([`Start within ${R('pickToProcessH').v} h of picking`, explain(R('pickToProcessH'))]);
      sort.todo.push(['Float the cherry and remove the floaters', 'Dry, damaged and overripe cherries float, so a float tank sorts out the low-quality fruit cheaply. ¦ Lucia Solis: Producer Toolkit #2 and #3']);
      sort.todo.push(m.drying === 'cherry' ? ['Pick out overripe cherry before a natural', 'Lucia\'s episode on "de-funkifying" naturals starts with sorting out overripe cherry. ¦ Lucia Solis: Making Coffee #71'] : ['Pick out green and overripe cherry', 'Aim for about 80% red ripe. Removing the worst fruit matters more than chasing 100%. ¦ Lucia Solis: Producer Toolkit #2 and #3']);
      if (m.drying !== 'cherry') sort.todo.push([`Pulp it. Quality drops if pulping waits past ${R('pickMaxH').v} h from picking`, explain(R('pickMaxH'))]);
      if (m.drying === 'honey') sort.todo.push(['Leave the mucilage on the parchment', 'The sweetness of a honey comes from the mucilage, so pulp with as little water as you can. ¦ Lucia Solis: Producer Toolkit #2']);
      if (!m.tank && c.needsDose) sort.todo.push([`Apply the starter (${starter}) to the coffee: ${doseText}`, c.ref]);
      stages.push(sort);

      // 2. Ferment and wash
      if (m.tank) {
        const f = { key: 'ferment', title: `${m.sealed ? 'Ferment sealed' : 'Ferment'}, ${starter ? 'with ' + starter : 'wild'}`, ...span(fStart, fe[1]), todo: [], done: [] };
        f.expect = [l && l.washedAt ? `Took ${fmt(fermentHours(l))} h` : `Usually ${fr.lo === fr.hi ? fmt(fr.lo) : fmt(fr.lo) + '–' + fmt(fr.hi)} h. The pH tells you when it's done, not the clock.`, fr.ref];
        if (c.needsDose) {
          const plan = p.kg ? computePlan({ kg: p.kg, yeast: p.culture, dose: p.dose, container: 'barrel' }) : null;
          f.todo.push([`Add ${doseText} of ${starter}.${plan ? ' ' + plan.steps.join(' ') : ''}`, c.ref]);
          f.todo.push(["Starters can shorten or lengthen it: a fast commercial microbe cut one cold mill's fermentations from 100 h to 24 h, and at Shira a yeast let them go from 12 h to 48 h for more flavour", 'A cold-tolerant coffee yeast freed up one mill\'s tanks. At Shira, the yeast kept a long fermentation clean, and the coffee tasted more intense. ¦ Lucia Solis: Producer Toolkit #3']);
        }
        if (c.id === 'lalcafe') {
          f.todo.push(['Keep the tank at 15 °C or warmer. Lallemand gives 20–24 °C as best for BSC and 18–25 °C for Briosa', 'Below 15 °C the yeast may not take hold before the wild microbes do. Inside the best range it works without over-fermented notes. ¦ LalCafé by Lallemand: Cima and BSC pages; Scott Labs: BSC and Briosa data sheets']);
          if (!m.sealed) f.todo.push(['Keep the coffee just under water, no more than 1 cm above it, and leave in as much mucilage as you can', 'The yeast makes its flavour from the fruit, so extra water dilutes it. ¦ Scott Labs: LalCafé BSC and Briosa data sheets']);
        }
        f.todo.push(['Check pH twice a day, in the morning and at the end of the day', 'pH falls as the microbes make acid, so it shows how far the fermentation has gone. Lucia checks at least twice a day. ¦ Lucia Solis: Producer Toolkit #3']);
        if (S.thermometer) f.todo.push([`Check the tank temperature at the same time. Alert above ${R('tempMax').v} °C`, explain(R('tempMax'))]);
        if (m.sealed && S.extraInstruments) f.todo.push([`Vent if the pressure passes ${R('pressureMax').v} PSI`, explain(R('pressureMax'))]);
        f.done.push([`pH is ${R('phEndpoint').v} or lower`, explain(R('phEndpoint'))]);
        if (parchment) f.done.push(['Hand test: the parchment feels gritty, like pebbles', 'Rub and rinse a few beans. When the mucilage is fully broken down they make a grating noise and feel gritty. Stop then to avoid over-fermenting. ¦ Schwan & Fleet 2014, ch. 10']);
        f.others = otherMills(p.method, 'f');
        stages.push(f);
        if (parchment) {
          const w = { key: 'wash', title: 'Wash', ...span(fe[0], fe[1]), todo: [], done: [] };
          w.expect = [l && l.washedAt ? `Done ${when(l.washedAt)}` : 'As soon as the fermentation is ready', ''];
          w.todo.push(['Wash off the fermented mucilage', 'Fermented parchment should be washed right after fermentation ends. ¦ Schwan & Fleet 2014, ch. 10']);
          w.todo.push([`Start drying within ${R('washToDryMaxH').v} h of washing`, explain(R('washToDryMaxH'))]);
          stages.push(w);
        }
      }

      // 3. Dry
      const surf = p.surface || (l && l.drying && l.drying.surface);
      const d = { key: 'dry', title: `Dry${surf ? ' on ' + surf.toLowerCase() : ''}`, ...span(ds[0], de[1]), todo: [], done: [] };
      d.expect = l && l.bag ? [`Took ${fmt((new Date(l.bag.at) - new Date(l.drying.startAt)) / DAY)} days`, '']
        : deFromWeights ? [`Ready about ${dayLabel(de[0])}, from your weighings`, 'At the latest drying rate. Below about 20% drying slows down (Lucia Solis, Producer Toolkit #2).']
        : [`Usually ${dr.lo === dr.hi ? dr.lo : dr.lo + '–' + dr.hi} days`, dr.ref];
      const sum = wxSummary(72);
      if (sum && !(l && l.bag)) {
        const poor = sum.days.filter(x => x.sunset >= ds[0] && x.sunrise <= de[1] && x.outlook === 'poor');
        const last = sum.days[sum.days.length - 1];
        d.forecast = poor.length ? `Poor drying days in the forecast: ${poor.map(x => shortDate(x.sunrise).replace(/ \S+$/, '')).join(', ')}. The app reminds you to cover.` : 'No poor drying days in the forecast for these dates.';
        if (last && de[1] > last.sunset) d.forecast += ` The forecast only runs to ${shortDate(last.sunrise)}.`;
      }
      const seed = seedLimitFor(m.drying);
      d.todo.push(['Every morning: spread it out in thin layers, about 10 cm', 'Start with thin layers, about 10 cm. Once partly dry, the layer can be thicker. ¦ ATI Philippines 2007; Schwan & Fleet 2014, ch. 10']);
      d.todo.push(['Through the day: rake 8–10 times', 'Raking turns the layer so it dries evenly and the top doesn\'t overheat. ¦ Schwan & Fleet 2014, ch. 10']);
      d.todo.push(['Every evening: pile and cover before sunset', 'Piled and covered, the coffee is protected from dew and rain overnight. ¦ ATI Philippines 2007; Schwan & Fleet 2014, ch. 10']);
      d.todo.push(['Before rain: pile and cover. The app reminds you from the forecast', 'Rewetting slows drying and keeps the seed moist, which risks mould. ¦ Lucia Solis: Producer Toolkit #2; forecast: Open-Meteo']);
      d.todo.push([`Keep the seed at or below ${seed.v} °C${S.setup.shade ? '. Shade cloth on in strong sun' : ''}`, explain(seed)]);
      if (m.drying === 'cherry') d.todo.push(["Light shade helps: Lucia's shaded lots dried in about 15 days under roughly 30–40% shade", 'Shade lowers the midday peak temperature, and Lucia\'s shaded naturals still dried in about 15 days. ¦ Lucia Solis: Making Coffee #71']);
      if (S.setup.dryer) d.todo.push([`With the dryer: use it first, then move to the patio at about ${R('dryerSwitch').v}%`, explain(R('dryerSwitch'))]);
      d.todo.push(['From the last few days: weigh it and take meter readings to see when it is ready', 'Weight loss tracks moisture loss, so two weighings let the app estimate the ready date. Starting near the end is my choice. ¦ Tool heuristic']);
      d.done.push([`Meter reads ${R('moistureTarget').v}% or less in ${R('meterSpots').v} spots`, explain(R('moistureTarget'))]);
      d.done.push([`The reading still holds ${R('holdHours').v} h later`, explain(R('holdHours'))]);
      d.done.push(['The beans feel hard and brittle', 'A quick hand check that backs up the meter: dry coffee is hard and brittle. ¦ ATI Philippines 2007']);
      d.others = otherMills(p.method, 'd');
      stages.push(d);

      // 4. Bag and rest
      const b = { key: 'bag', title: 'Bag and rest', ...span(de[0], de[1]), todo: [], done: [] };
      b.expect = [l && l.bag ? `Bagged ${dayLabel(l.bag.at)}` : `Then rest several weeks before hulling`, l && l.bag ? '' : 'Dried coffee is stored for several weeks before the parchment comes off, to improve shelf life. ¦ Hackler & Särchen 2025, ch. 5'];
      b.todo.push(['Use barrier bags (polyethylene plus EVOH)', 'Polyethylene stops moisture and EVOH stops oxygen, so together they slow ageing. ¦ Lucia Solis: Producer Toolkit #7']);
      b.todo.push(['Store away from smoke, fuel and kitchen smells', '"Coffee is a sponge": it soaks up any smell near it. ¦ Lucia Solis: Producer Toolkit #7']);
      b.todo.push(["Don't bag it while it is still warm from the sun", 'SICC advises against bagging warm coffee, and resting lets moisture even out inside the bean. ¦ SICC: Moisture Content vs Water Activity']);
      b.todo.push(['Re-check the moisture once a month', 'Stored coffee can take moisture back from humid air. Monthly is my choice. ¦ Tool heuristic; Schwan & Fleet 2014, ch. 10']);
      b.todo.push(['After resting, cup it and write down what you taste', 'Cupping is how you connect what happened in the tank to what is in the cup: "without that feedback loop, you really can\'t improve". ¦ Lucia Solis: Producer Toolkit #3']);
      b.todo.push(['The app saves the lot as a recipe, so next time the timeline uses your own hours and days', 'Your own mill\'s numbers beat any book\'s range. ¦ Design choice']);
      stages.push(b);
      return stages;
    }

    function currentStage(l) {
      const st = lotStage(l);
      if (st === 'fermenting') return 'ferment';
      if (st === 'to dry' || st === 'drying') return 'dry';
      return 'bag';
    }

    // Vertical timeline. With a lot, the current step holds its action card.
    function roadmapHtml(stages, l) {
      const order = stages.map(s => s.key);
      const cur = l ? currentStage(l) : null;
      const ci = cur ? order.indexOf(cur) : -1;
      const total = stages[stages.length - 1].days.replace(/^Day /, '');
      let html = l ? '' : `<div class="card !p-3 mt-3 text-[15px] text-coffee-100">Roughly <b class="text-white">${total} days</b> from today to bagged coffee, then several weeks of rest.</div>`;
      return html + `<ol class="mt-4">${stages.map((s, i) => {
        const done = l ? (i < ci || (l.bag && s.key === 'bag')) : false;
        const now = l ? i === ci && !(l.bag && s.key === 'bag') : false;
        const last = i === stages.length - 1;
        const dot = done ? 'bg-emerald-500 border-emerald-500 text-white' : now ? 'bg-amber-500 border-amber-500 text-white' : 'border-coffee-600 text-coffee-300 bg-coffee-950';
        const list = items => items.map(([t, r]) => `<li class="flex gap-2 text-coffee-100"><span class="text-coffee-500">•</span><div class="inline-why">${esc(t)}${why(r)}</div></li>`).join('');
        let body = `<div class="flex items-start justify-between gap-2"><div class="text-lg font-bold leading-tight ${done ? 'text-emerald-200' : 'text-white'}">${esc(s.title)}</div><span class="text-xs font-semibold rounded-full px-2 py-0.5 flex-shrink-0 ${now ? 'bg-amber-500 text-white' : done ? 'bg-emerald-600/30 text-emerald-200' : 'bg-coffee-800 text-coffee-200'}">${done ? 'Done' : now ? 'Now' : s.days}</span></div>
          <div class="text-sm text-coffee-400">${esc(s.dates)}</div>
          ${s.expect && s.expect[0] ? `<div class="inline-why text-[15px] ${now ? 'text-amber-200' : 'text-coffee-200'} mt-1">${esc(s.expect[0])}${why(s.expect[1])}</div>` : ''}`;
        const plan = `${s.todo.length ? `<ul class="space-y-1.5 mt-2 text-[15px]">${list(s.todo)}</ul>` : ''}
          ${s.done.length ? `<div class="mt-3 text-sm text-coffee-400">Done when</div><ul class="space-y-1.5 mt-1 text-[15px]">${s.done.map(([t, r]) => `<li class="flex gap-2 text-emerald-100"><i data-lucide="check" class="w-4 h-4 mt-0.5 text-emerald-400 flex-shrink-0"></i><div class="inline-why">${esc(t)}${why(r)}</div></li>`).join('')}</ul>` : ''}
          ${s.forecast ? `<p class="text-sm text-sky-200 mt-2">${esc(s.forecast)}</p>` : ''}
          ${s.others && s.others.length ? `<details class="mt-2"><summary class="text-sm text-coffee-300 underline cursor-pointer">What other mills did</summary><ul class="space-y-1 mt-1 text-sm text-coffee-300">${s.others.map(([t, u]) => `<li>${esc(t)} <a class="underline text-coffee-400" href="${u}" target="_blank" rel="noopener">source</a></li>`).join('')}</ul></details>` : ''}`;
        if (l && now) body += `<div class="mt-3">${actionCard(l)}</div><details class="mt-2"><summary class="text-sm text-coffee-300 underline cursor-pointer">Everything to do in this step</summary>${plan}</details>`;
        else if (l && l.bag && s.key === 'bag') body += `<div class="mt-3">${restCard(l, true)}</div>`;
        else if (l && !done) body += `<details class="mt-1"><summary class="text-sm text-coffee-300 underline cursor-pointer">What you'll do</summary>${plan}</details>`;
        else if (!l) body += plan;
        return `<li class="relative flex gap-3 ${last ? '' : 'pb-6'}">
          ${last ? '' : `<span class="absolute left-[15px] top-8 bottom-0 w-0.5 ${done ? 'bg-emerald-600' : 'bg-coffee-800'}"></span>`}
          <span class="relative z-10 w-8 h-8 rounded-full border-2 flex items-center justify-center flex-shrink-0 text-sm font-bold ${dot}">${done ? '<i data-lucide="check" class="w-4 h-4"></i>' : i + 1}</span>
          <div class="flex-1 min-w-0 pt-0.5">${body}</div>
        </li>`;
      }).join('')}</ol>`;
    }
    // What the process is, from the Aviary glossary (index.html)
    function glossHtml(id) {
      const g = methodOf(id).gloss;
      if (!g) return '';
      return `<div class="inline-why text-sm text-coffee-300 ml-8 mt-2">${esc(g[1])}${why('Feran\'s glossary defines each process by what is done to the cherry (skin, environment, additives), not by time. Time is "not critical to the definition" for most of them, which is why the timeline uses research ranges. ¦ Christopher Feran, A sort of glossary of coffee processes (2022)')} <a href="index.html#p=${g[0]}" class="underline text-coffee-400">Glossary entry</a></div>`;
    }

    // What it might taste like: process, starter, cultivar, your own past cups
    function flavourHtml(p) {
      const m = methodOf(p.method), c = cultureOf(p.culture), l = p.lot;
      const rows = (PROCESS_FLAVOURS[m.ref] || []).slice();
      if (m.sealed && c.id !== 'none') rows.push(['With an S. cerevisiae yeast starter, sealed lots showed more citrus, floral, plum or peach than without one', 'Research compared the same anaerobic fermentation with and without that yeast. ¦ ' + HS6]);
      if (m.tank && c.id !== 'none') rows.push(['In one trial, a longer fermentation with a coffee yeast tasted more intense and a little cleaner. The notes stayed similar', 'Lucia Solis: Producer Toolkit #3 (La Cabra and Shira, 12 h wild vs 48 h with yeast)']);
      const cv = (state.cultivars || []).find(x => x.name === p.cultivar);
      if (cv && cv.flavor) rows.push([`${cv.name}: ${cv.flavor.charAt(0).toLowerCase()}${cv.flavor.slice(1)} (washed lots)`, cv.flavorRef]);
      const mine = state.recipes.filter(r => r.flavor && r.process === p.method && (!l || r.lotId !== l.id)).slice(-2).map(r => [`Your ${r.fromLot}: ${r.flavor}${r.cupScore != null ? ` (${fmt(r.cupScore, 2)})` : ''}`, '']);
      const li = (t, r) => `<li class="flex gap-2 text-coffee-100"><span class="text-coffee-500">•</span><div class="inline-why">${esc(t)}${why(r)}</div></li>`;
      let html = heading('What it might taste like') + `<div class="card space-y-3">`;
      if (l && l.flavor) html += `<p class="text-[15px] text-emerald-200">You tasted: <b class="text-white">${esc(l.flavor)}</b>${l.cupScore != null ? ` · ${fmt(l.cupScore, 2)}` : ''}</p>`;
      html += rows.length ? `<ul class="space-y-1.5 text-[15px]">${rows.map(([t, r]) => li(t, r)).join('')}</ul>` : `<p class="text-[15px] text-coffee-300">No flavour description for this process in the sources yet.</p>`;
      const cups = ROASTER_LOTS.filter(x => x.t && x.p === m.ref).sort((a, b) => (b.s || 0) - (a.s || 0)).slice(0, 4);
      if (cups.length) html += `<details><summary class="text-sm text-coffee-300 underline cursor-pointer">What other mills' ${esc(m.ref)} lots tasted like</summary><ul class="space-y-1.5 mt-2 text-[15px]">${cups.map(x => `<li class="flex gap-2 text-coffee-100"><span class="text-coffee-500">•</span><div>${esc(x.t)}${x.s ? ` · ${fmt(x.s, 2)} pts` : ''} <span class="text-sm text-coffee-400">(${esc(x.r)}: ${esc(x.lot)})</span> <a class="underline text-sm text-coffee-400" href="${x.u}" target="_blank" rel="noopener">source</a></div></li>`).join('')}</ul></details>`;
      if (mine.length) html += `<ul class="space-y-1.5 text-[15px] border-t border-coffee-800 pt-3">${mine.map(([t]) => li(t, '')).join('')}</ul>`;
      html += `<details><summary class="text-sm text-coffee-300 underline cursor-pointer">Off-notes to watch for</summary><ul class="space-y-1.5 mt-2 text-[15px]">${OFF_NOTES.map(([t, r]) => li(t, r)).join('')}</ul></details>`;
      html += `<div class="inline-why text-sm text-coffee-400 ">A direction, not a promise. Fermentation leaves acids and other compounds in the bean, and the flavour itself forms when it is roasted.${why('Microbes make acids and other compounds in the mucilage, which move into the seed and shape the aroma formed in roasting. So the process sets a direction, and only your own cupping tells you the result. ¦ Hackler & Särchen 2025; Lucia Solis: Producer Toolkit #3')}</div>`;
      return html + '</div>';
    }

    // What to write down so the next lot is better. Ticks show what this lot has.
    function recordHtml(l, method) {
      const m = methodOf(l ? l.method : method), rs = l ? readingsOf(l) : [], ws = l && l.drying ? (l.drying.weighings || []) : [];
      const T3 = 'Lucia Solis: Producer Toolkit #3', T2 = 'Lucia Solis: Producer Toolkit #2';
      const items = [
        [l && l.counts && Object.values(l.counts).some(v => v), 'Ripeness: count ripe, unripe and overripe in a sample of 100 cherries', `A board with 100 holes gives you a ripeness percentage you can track across the harvest and compare with the cup. ¦ ${T2}`],
        [l && !!(l.crushed || l.warm || l.notes), 'The condition of the cherry before you start', `Lucia lists the cherry\'s condition among the notes to keep, so you can find what links to the cup later. ¦ ${T3}`],
      ];
      if (m.tank) items.push(
        [rs.some(r => r.ph != null), 'pH, morning and end of day', `pH shows how far the fermentation has gone. ¦ ${T3}`],
        [rs.some(r => r.temp != null), 'Tank temperature', `Temperature sets the speed: "a pH meter and a thermometer are your eyes inside the fermentation". ¦ ${T3}`],
        [rs.some(r => r.smell), 'What the tank smells like', `Lucia lists the tank's smell among the notes to keep, so you can link it to the cup later. ¦ ${T3}`]);
      items.push(
        [l && l.wx && Object.keys(l.wx).length, 'The weather each day (the app saves it whenever it fetches the forecast)', `Heat and rain change both fermentation and drying, so they help explain a good or bad lot. ¦ ${T3}`],
        [ws.length > 0, 'Drying: weight and moisture meter readings', `Lucia: "buy the best moisture meter you can afford". Weight shows the drying rate between readings. ¦ ${T2}`],
        [ws.some(w => w.seedTemp != null), 'Coffee temperature while drying, to keep it below 40 °C', `Above 40 °C the seed is damaged and fades early. ¦ ${T2}`],
        [null, 'Photos and videos on your phone: they keep the date and time', `A photo records the date, time and weather for you. ¦ ${T3}`],
        [l && l.cupScore != null, 'After resting: cup it, write the flavour notes, then compare them with these notes', `This is the feedback loop that lets you improve. ¦ ${T3}`]);
      return `<details class="card mt-4"${l && l.bag ? ' open' : ''}><summary class="text-[15px] text-coffee-100 cursor-pointer font-semibold">Write these down for next time</summary>
        <ul class="space-y-1.5 mt-3 text-[15px]">${items.map(([ok, t, r]) => `<li class="flex gap-2 ${ok ? 'text-emerald-100' : 'text-coffee-100'}"><i data-lucide="${ok ? 'check-circle-2' : 'circle'}" class="w-4 h-4 mt-0.5 flex-shrink-0 ${ok ? 'text-emerald-400' : 'text-coffee-600'}"></i><div class="inline-why">${esc(t)}${why(r)}</div></li>`).join('')}</ul>
        <div class="inline-why text-sm text-coffee-400 mt-3 ">Cherry Brix is not a reliable sign of a sweet cup.${why(`The data hasn't supported a link between high-Brix cherry and a sweet cup, and Brix also rises when cherries lose water. ¦ ${T2}`)}</div>
      </details>`;
    }

    // Save each day's weather on lots that are still fermenting or drying
    function logLotWeather(j) {
      const D = j && j.daily;
      if (!D || !D.time || !D.time.length) return;
      state.lots.filter(l => !l.sample && !l.bag).forEach(l => {
        l.wx = l.wx || {};
        l.wx[D.time[0]] = { tmax: D.temperature_2m_max[0], tmin: D.temperature_2m_min[0], rain: D.precipitation_sum[0] };
      });
    }
    function actionCard(l) {
      const st = lotStage(l);
      if (st === 'fermenting') return fermentCard(l, true);
      if (st === 'to dry') return startDryCard(l, true);
      if (st === 'drying') return dryCard(l, true);
      return restCard(l, true);
    }
    function lotRoadmap(l) {
      const recipe = l.recipeId ? state.recipes.find(r => r.id === l.recipeId) : null;
      return roadmap({ method: l.method, culture: l.culture, product: l.product, dose: l.dose, kg: l.cherryKg, surface: l.drying ? l.drying.surface : l.surface, start: new Date(l.createdAt).getTime(), lot: l, recipe });
    }

    function surfaceOptions() {
      const s = state.settings.setup, o = [];
      if (s.beds) o.push('Raised beds'); if (s.patio) o.push('Patio'); if (s.polyhouse) o.push('Polyhouse'); if (s.covered) o.push('Covered area'); if (s.dryer) o.push('Mechanical dryer');
      if (s.shade) o.push('Raised beds under shade cloth');
      return o.length ? o : ['Patio'];
    }
    function startDryCard(l, bare) {
      return (bare ? '' : heading('Start drying')) + `<div class="card space-y-3">
        <form onsubmit="startDrying(event,'${l.id}')" class="space-y-3">
          <div class="text-[15px] text-coffee-100">Where will it dry?</div>
          <select name="surface" class="field-lg">${surfaceOptions().map(s => `<option ${s === l.surface ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
          <button class="btn-big"><i data-lucide="sun" class="w-5 h-5"></i> Start drying now</button>
        </form>
        <div class="inline-why text-sm text-coffee-400">Spread in thin layers, about 10 cm, and rake 8–10 times a day.${why('Thin layers and frequent raking dry the coffee evenly and stop the top from overheating. ¦ Schwan & Fleet 2014, ch. 10')}</div>
      </div>`;
    }

    function dryCard(l, bare) {
      const S = state.settings;
      const di = dryingInfo(l);
      const day = Math.floor((Date.now() - new Date(l.drying.startAt)) / DAY) + 1;
      const open = state.openForm === 'weigh';
      let html = bare ? `<div class="text-sm text-coffee-300 mb-2">Day ${day} of drying</div>` : heading(`Drying · day ${day} · ${esc(l.drying.surface || '')}`);
      html += `<div class="card space-y-3">`;
      if (di.ready) html += `<div class="rounded-xl bg-emerald-500/15 border border-emerald-500/50 p-3 text-emerald-200 text-[15px] font-semibold">Dry. Bag it.</div>`;
      const facts = [];
      if (di.estNow != null) facts.push(`About <b class="text-white">${fmt(di.estNow, 1)}%</b> now${di.pts.length ? ' (from weight)' : ''}`);
      if (di.targetW) facts.push(`Ready at about <b class="text-white">${fmt(di.targetW, 1)} kg</b>`);
      if (di.eta) facts.push(`Expected around <b class="text-white">${esc(dayLabel(di.eta))}</b>`);
      html += facts.length ? `<p class="text-[15px] text-coffee-200">${facts.join(' · ')}${di.eta ? why('Worked out from the latest drying rate. Below about 20% the water is bound more tightly and drying slows, so the real date is likely later. ¦ Lucia Solis: Producer Toolkit #2') : ''}</p>` : `<p class="text-[15px] text-coffee-300">Weigh it and take a meter reading. After two weighings the app can estimate the ready date.</p>`;
      html += `<div><div class="text-sm text-coffee-400 mb-1">Ready when</div>
        ${tick(di.meterOk, `Meter reads ${di.target}% or less in ${di.spots.v} spots`, `${explainR(resolve('moistureTarget'))} ${explainR(di.spots)} ¦ Target: ${srcLabel(resolve('moistureTarget'))}. Spots: ${srcLabel(di.spots)}`)}
        ${tick(di.holdOk, `The reading still holds ${di.hold.v} h later`, explain(di.hold))}
        ${tick(di.brittle, 'The beans feel hard and brittle', 'ATI Philippines 2007')}</div>`;
      if (!open) html += `<button onclick="toggleForm('weigh')" class="btn-big ${di.ready ? 'ghost' : ''}"><i data-lucide="scale" class="w-5 h-5"></i> Weigh and take readings</button>`;
      else html += `<form onsubmit="addWeighing(event,'${l.id}')" class="space-y-3 border-t border-coffee-800 pt-3">
          <div><div class="text-sm text-coffee-300 mb-1">Weight (whole lot or a marked tray)</div><div class="relative"><input name="weight" type="number" step="0.01" inputmode="decimal" class="field-lg pr-12"><span class="absolute right-4 top-1/2 -translate-y-1/2 text-coffee-400">kg</span></div></div>
          <div><div class="text-sm text-coffee-300 mb-1">Meter readings, % (one per spot)</div><input name="meter" inputmode="decimal" placeholder="e.g. 18.5, 19.2, 18.9" class="field-lg"></div>
          ${S.thermometer ? '<div><div class="text-sm text-coffee-300 mb-1">Seed temperature °C</div><input name="seedTemp" type="number" step="0.1" inputmode="decimal" class="field-lg"></div>' : ''}
          <label class="chk-lg"><input name="brittle" type="checkbox"> Feels hard and brittle</label>
          <input name="notes" placeholder="Notes (optional)" class="field-lg">
          <details><summary class="text-sm text-coffee-400 underline cursor-pointer">Different time?</summary><input name="at" type="datetime-local" value="${toLocalInput(new Date())}" class="field-lg mt-2"></details>
          <div class="grid grid-cols-2 gap-2"><button type="button" onclick="toggleForm('weigh')" class="btn-big ghost">Cancel</button><button class="btn-big">Save</button></div>
        </form>`;
      const nextW = lotReminders(l, 48).find(r => r.kind === 'moisture');
      if (nextW && !open && !di.ready) html += `<div class="inline-why text-sm text-coffee-400">Next weighing: ${esc(when(nextW.at))}.${why(nextW.ref)}</div>`;
      if (di.pts.length >= 2) html += lineChart(di.pts.map(p => ({ x: (new Date(p.at) - new Date(l.drying.startAt)) / DAY, y: p.m })), { title: 'Moisture from weight (%)', color: '#22D3EE', dp: 0, xUnit: 'd', lines: [{ y: di.target, label: `target ${di.target}%`, color: '#34D399' }] });
      html += di.ready || state.openForm === 'bag' ? bagForm(l, di) : `<button onclick="toggleForm('bag')" class="text-sm text-coffee-400 underline">Bag it anyway</button>`;
      return html + '</div>';
    }

    function bagForm(l, di) {
      const m = di.last && avg(di.last.meter);
      return `<form onsubmit="bagLot(event,'${l.id}')" class="space-y-3 border-t border-coffee-800 pt-3">
        <div class="text-lg font-semibold text-white">Bag it</div>
        <div><div class="text-sm text-coffee-300 mb-1">Bags</div><select name="type" class="field-lg"><option value="barrier">Barrier bags (PE + EVOH)</option><option value="pe">Plain plastic (polyethylene)</option><option value="jute">Jute</option></select></div>
        <div class="grid grid-cols-2 gap-2">
          <div><div class="text-sm text-coffee-300 mb-1">Final meter %</div><input name="moisture" type="number" step="0.1" inputmode="decimal" value="${m != null ? fmt(m, 1) : ''}" required class="field-lg"></div>
          <div><div class="text-sm text-coffee-300 mb-1">Number of bags</div><input name="bags" type="number" min="0" inputmode="numeric" class="field-lg"></div>
        </div>
        <input name="notes" placeholder="What worked? What would you change?" class="field-lg">
        <label class="chk-lg"><input name="recipe" type="checkbox" checked> Save as a recipe for next time</label>
        <button class="btn-big"><i data-lucide="package" class="w-5 h-5"></i> Bag it</button>
        <div class="inline-why text-sm text-coffee-400">Barrier bags keep out moisture and air.${why('A 60 kg barrier bag costs about $3 and can be reused about three times if washed and dried, so it costs a few cents per kilo. ¦ Lucia Solis: Producer Toolkit #7')}</div>
      </form>`;
    }

    function restCard(l, bare) {
      const days = (Date.now() - new Date(l.bag.at)) / DAY;
      return (bare ? '' : heading('Bagged')) + `<div class="card space-y-2">
        <p class="text-[15px] text-coffee-100">Bagged ${esc(dayLabel(l.bag.at))} at ${fmt(l.bag.moisture, 1)}% in ${esc({ barrier: 'barrier bags', pe: 'plain plastic', jute: 'jute' }[l.bag.type] || 'bags')}. Resting for ${fmt(days)} days.</p>
        <div class="inline-why text-sm text-coffee-400">Lots rest for several weeks before hulling. Keep the bags away from smells.${why('Resting improves shelf life, and coffee soaks up any smell near it. ¦ Hackler & Särchen 2025, ch. 5; Lucia Solis: Producer Toolkit #7')}</div>
        ${l.recipeSaved ? '<p class="text-sm text-emerald-300">Saved as a recipe.</p>' : ''}
        <form onsubmit="saveCup(event,'${l.id}')" class="space-y-2 border-t border-coffee-800 pt-3">
          <div class="text-[15px] text-white font-semibold">Cup it <span class="opt">(after resting)</span></div>
          <input name="flavor" value="${esc(l.flavor || '')}" placeholder="What did you taste? e.g. lime, black tea, caramel" class="field-lg">
          <input name="cupScore" type="number" step="0.25" min="0" max="100" inputmode="decimal" value="${l.cupScore ?? ''}" placeholder="Score (optional)" class="field-lg">
          <button class="btn-big ghost">Save</button>
          <div class="inline-why text-sm text-coffee-400 ">Then compare it with your notes from the tank and the drying beds.${why('Cupping is how you link what happened in the tank to the cup. Without that feedback loop you can\'t improve. ¦ Lucia Solis: Producer Toolkit #3')}</div>
        </form>
      </div>`;
    }

    function historyHtml(l) {
      const rs = readingsOf(l);
      const ws = l.drying ? dryingInfo(l).ws : [];
      const acts = l.actions || [];
      const wxd = Object.values(l.wx || {});
      if (!rs.length && !ws.length && !acts.length && !wxd.length) return '';
      const count = k => acts.filter(a => a.kind === k).length;
      let html = `<details class="mt-6"><summary class="text-sm text-coffee-300 underline cursor-pointer">History</summary><div class="card mt-2 space-y-3 text-sm">`;
      if (rs.length) html += `<div><div class="text-coffee-400 mb-1">pH readings</div><table class="data w-full"><tbody>${rs.map(r => `<tr><td class="text-coffee-400">${fmt(fermentHours(l, r), 1)} h</td><td class="text-white">${fmt(r.ph, 2)}</td><td class="whitespace-normal">${r.hand ? '<span class="text-emerald-300">hand test ✓</span> ' : ''}${esc(r.smell || '')}</td><td><button onclick="deleteReading('${l.id}','${r.at}')" class="text-coffee-500" title="Delete"><i data-lucide="x" class="w-4 h-4"></i></button></td></tr>`).join('')}</tbody></table></div>`;
      if (ws.length) html += `<div><div class="text-coffee-400 mb-1">Weighings</div><table class="data w-full"><tbody>${ws.map(w => `<tr><td class="text-coffee-400">${esc(dayLabel(w.at))}</td><td class="text-white">${fmt(w.weight, 1)} kg</td><td>${w.meter && w.meter.length ? esc(w.meter.map(v => fmt(v, 1)).join(', ')) + '%' : ''}</td><td>${w.brittle ? 'brittle' : ''}</td><td><button onclick="deleteWeighing('${l.id}','${w.at}')" class="text-coffee-500" title="Delete"><i data-lucide="x" class="w-4 h-4"></i></button></td></tr>`).join('')}</tbody></table></div>`;
      if (wxd.length) html += `<p class="text-coffee-300">Weather saved for ${wxd.length} day${wxd.length > 1 ? 's' : ''}: highs averaged ${fmt(avg(wxd.map(x => x.tmax)), 1)} °C, 1 mm or more of rain on ${wxd.filter(x => x.rain >= 1).length}.</p>`;
      if (acts.length) html += `<p class="text-coffee-300">Logged: ${count('rake')} rakes, ${count('pile') + count('cover')} times piled or covered, ${count('spread') + count('uncover')} times spread.</p>`;
      return html + '</div></details>';
    }

    // ---------------------------------------------------------------
    // LOT ACTIONS
    // ---------------------------------------------------------------
    function formTime(f) { return f.at && f.at.value ? new Date(f.at.value).toISOString() : new Date().toISOString(); }
    function addReading(e, id) {
      e.preventDefault();
      const l = lotById(id), f = e.target;
      const r = { at: formTime(f), ph: num(f.ph.value), temp: f.temp ? num(f.temp.value) : null, brix: f.brix ? num(f.brix.value) : null, psi: f.psi ? num(f.psi.value) : null, smell: f.smell.value.trim(), hand: !!(f.hand && f.hand.checked) };
      l.readings = (l.readings || []).filter(x => x.at !== r.at).concat([r]);
      state.openForm = null; save(); renderAll();
    }
    function deleteReading(id, at) { const l = lotById(id); l.readings = l.readings.filter(r => r.at !== at); save(); renderAll(); }
    function finishFermentation(id) {
      const l = lotById(id);
      if (!fermentReady(l).ready && !confirm('The ready checks are not all ticked yet. Finish the fermentation anyway?')) return;
      l.washedAt = new Date().toISOString(); save(); renderAll();
    }
    function startDrying(e, id) {
      e.preventDefault();
      const l = lotById(id), f = e.target;
      l.drying = { startAt: new Date().toISOString(), surface: f.surface.value, target: V('moistureTarget'), weighings: [] };
      save(); renderAll();
    }
    function addWeighing(e, id) {
      e.preventDefault();
      const l = lotById(id), f = e.target;
      const w = { at: formTime(f), weight: num(f.weight.value), meter: parseList(f.meter.value), seedTemp: f.seedTemp ? num(f.seedTemp.value) : null, brittle: f.brittle.checked, notes: f.notes.value.trim() };
      l.drying.weighings = (l.drying.weighings || []).filter(x => x.at !== w.at).concat([w]);
      state.openForm = null; save(); renderAll();
    }
    function deleteWeighing(id, at) { const l = lotById(id); l.drying.weighings = l.drying.weighings.filter(w => w.at !== at); save(); renderAll(); }
    function bagLot(e, id) {
      e.preventDefault();
      const l = lotById(id), f = e.target;
      l.bag = { at: new Date().toISOString(), type: f.type.value, moisture: num(f.moisture.value), bags: num(f.bags.value), notes: f.notes.value.trim() };
      if (f.recipe.checked) { state.recipes.push(recipeFromLot(l)); l.recipeSaved = true; }
      state.openForm = null; save(); renderAll(); window.scrollTo({ top: 0 });
    }
    function saveCup(e, id) {
      e.preventDefault();
      const l = lotById(id), f = e.target;
      l.cupScore = num(f.cupScore.value); l.flavor = f.flavor.value.trim();
      state.recipes.filter(r => r.lotId === id).forEach(r => { r.cupScore = l.cupScore; r.flavor = l.flavor; });
      save(); renderAll();
    }
    function deleteLot(id) {
      const l = lotById(id);
      if (!confirm(`Delete ${l.code} and all its readings?`)) return;
      state.lots = state.lots.filter(x => x.id !== id);
      state.selectedId = null;
      save(); setTab('lots');
    }

    function renderRecipesPage() {
      if (!state.recipes.length) return '<p class="text-[15px] text-coffee-300">No recipes yet. A recipe is saved when you bag a lot. Next time you buy the same cultivar from a similar altitude, it is offered first.</p>';

        <div class="flex items-start justify-between gap-2"><div><div class="text-white font-semibold">${esc(r.cultivar || '–')} · ${esc(r.process)}</div><div class="text-sm text-coffee-400">${fmt(r.masl)} m · from ${esc(r.fromLot)}</div></div><button onclick="deleteRecipe('${r.id}')" class="text-coffee-500" title="Delete"><i data-lucide="x" class="w-4 h-4"></i></button></div>
        ${r.fermentH ? `<p class="text-[15px] text-coffee-200">Fermented ${fmt(r.fermentH)} h${r.fermentTemp ? ` at ${fmt(r.fermentTemp, 1)} °C` : ''}, stopped at pH ${fmt(r.phEnd, 2)}${r.culture && r.culture !== 'none' ? ` with ${esc(r.product || cultureOf(r.culture).name)}` : ''}.</p>` : ''}
        <p class="text-[15px] text-coffee-200">Dried ${fmt(r.dryDays)} days${r.surface ? ` on ${esc(r.surface.toLowerCase())}` : ''} to ${fmt(r.finalMoisture, 1)}%${r.rakes ? `, raked ${r.rakes} times` : ''}.</p>
        ${r.notes ? `<p class="text-sm text-coffee-300">${esc(r.notes)}</p>` : ''}

    function renderRefs() {
