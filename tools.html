<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mill Assistant</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            coffee: {
              50: '#FDFBF7',
              100: '#F7F2EA',
              200: '#E9DEC9',
              300: '#D5C3A5',
              400: '#BBA27E',
              500: '#9E8057',
              600: '#81633F',
              700: '#654B2E',
              800: '#4B3520',
              900: '#322214',
              950: '#1C120A',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1C120A; }
    ::-webkit-scrollbar-thumb { background: #4B3520; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #81633F; }
    .field { width: 100%; background: #1C120A; border: 1px solid #4B3520; border-radius: 0.5rem; padding: 0.375rem 0.625rem; font-size: 16px; color: #E9DEC9; }
    @media (min-width: 640px) { .field { font-size: 0.8125rem; } }
    .field:focus { outline: none; border-color: rgba(245, 158, 11, 0.5); }
    .lbl { display: block; font-size: 0.6875rem; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.04em; color: #BBA27E; margin-bottom: 0.25rem; }
    .card { background: rgba(50, 34, 20, 0.6); border: 1px solid rgba(75, 53, 32, 0.8); border-radius: 0.75rem; padding: 1rem; }
    .btn { display: inline-flex; align-items: center; gap: 0.375rem; padding: 0.4rem 0.75rem; border-radius: 0.5rem; font-size: 0.8125rem; font-weight: 500; transition: background 0.15s; }
    .btn-primary { background: #D97706; color: #fff; }
    .btn-primary:hover { background: #B45309; }
    .btn-ghost { background: #322214; color: #D5C3A5; border: 1px solid #4B3520; }
    .btn-ghost:hover { background: #4B3520; color: #fff; }
    .btn-sm { padding: 0.25rem 0.5rem; font-size: 0.75rem; }
    .src { font-size: 0.625rem; font-family: 'JetBrains Mono', monospace; color: #9E8057; }
    .chk { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8125rem; color: #E9DEC9; }
    table.data td, table.data th { padding: 0.375rem 0.5rem; text-align: left; white-space: nowrap; }
    table.data th { font-size: 0.6875rem; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; color: #BBA27E; font-weight: 500; }
    table.data tbody tr { border-top: 1px solid rgba(75, 53, 32, 0.6); }
    table.wrap td { white-space: normal; vertical-align: top; }
    .mode-open { background: #F59E0B; } .mode-shade { background: #A855F7; } .mode-slow { background: #64748B; }
    .mode-cover { background: #0EA5E9; } .mode-night { background: #1E293B; }
    .field-lg { width: 100%; background: #1C120A; border: 1px solid #4B3520; border-radius: 0.75rem; padding: 0.75rem 0.875rem; font-size: 17px; color: #F7F2EA; }
    .field-lg:focus { outline: none; border-color: rgba(245, 158, 11, 0.6); }
    .q { display: block; font-size: 1rem; font-weight: 600; color: #F7F2EA; margin: 1.25rem 0 0.5rem; }
    .opt { font-weight: 400; color: #9E8057; font-size: 0.85rem; }
    .chip { padding: 0.6rem 0.95rem; border-radius: 0.75rem; border: 1px solid #4B3520; background: #322214; color: #E9DEC9; font-size: 0.95rem; font-weight: 500; }
    .chip-on { background: #D97706; border-color: #D97706; color: #fff; }
    .chk-lg { display: flex; align-items: center; gap: 0.75rem; padding: 0.7rem 0.875rem; border: 1px solid #4B3520; border-radius: 0.75rem; background: rgba(28, 18, 10, 0.6); font-size: 15px; color: #F7F2EA; }
    .chk-lg input { width: 1.25rem; height: 1.25rem; accent-color: #D97706; flex-shrink: 0; }
    .btn-big { display: flex; width: 100%; justify-content: center; align-items: center; gap: 0.5rem; padding: 0.9rem 1rem; border-radius: 0.75rem; font-size: 1rem; font-weight: 600; background: #D97706; color: #fff; }
    .btn-big:active { background: #B45309; }
    .btn-big.ghost { background: #322214; color: #E9DEC9; border: 1px solid #4B3520; }
    .row-btn { display: flex; align-items: center; gap: 0.75rem; width: 100%; text-align: left; padding: 0.875rem 1rem; border-radius: 0.75rem; background: rgba(50, 34, 20, 0.6); border: 1px solid rgba(75, 53, 32, 0.8); }
    details.why { margin-top: 0.125rem; }
    .inline-why details.why { display: inline; margin-left: 0.375rem; }
    .inline-why details.why[open] { display: block; margin-left: 0; }
    details.why > summary { display: inline; cursor: pointer; font-size: 0.75rem; color: #BBA27E; text-decoration: underline; list-style: none; }
    details.why > summary::-webkit-details-marker { display: none; }
    details.why .why-body { margin-top: 0.375rem; padding: 0.5rem 0.625rem; border-left: 2px solid #8A6A3F; background: rgba(138, 106, 63, 0.12); border-radius: 0 0.5rem 0.5rem 0; }
    details.why .why-r { font-size: 0.875rem; line-height: 1.4; color: #E8DCC8; }
    details.why .why-s { font-size: 0.7rem; font-family: 'JetBrains Mono', monospace; color: #9E8057; margin-top: 0.25rem; }
    .navbtn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 0.55rem 0 0.45rem; font-size: 0.72rem; color: #9E8057; }
    .navbtn.on { color: #F59E0B; }
  </style>
</head>
<body class="bg-coffee-950 text-coffee-100 font-sans min-h-screen antialiased selection:bg-coffee-500 selection:text-white">
  <header class="sticky top-0 z-40 bg-coffee-950/95 backdrop-blur-md border-b border-coffee-800/60">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center gap-2">
      <button id="backBtn" onclick="goBack()" class="hidden p-2 -ml-2 rounded-lg text-coffee-200" aria-label="Back"><i data-lucide="arrow-left" class="w-6 h-6"></i></button>
      <div class="min-w-0 flex-1">
        <h1 id="pageTitle" class="text-lg font-bold text-white truncate leading-tight">Today</h1>
        <p id="millName" class="text-xs text-coffee-400 truncate"></p>
      </div>
      <a href="index.html" class="p-2 text-amber-400" title="Back to the Processing Matrix"><i data-lucide="flask-conical" class="w-5 h-5"></i></a>
    </div>
  </header>

  <main id="view" class="max-w-2xl mx-auto px-4 pt-4 pb-28"></main>

  <nav class="fixed bottom-0 inset-x-0 z-40 bg-coffee-950/95 backdrop-blur-md border-t border-coffee-800" style="padding-bottom: env(safe-area-inset-bottom)">
    <div class="max-w-2xl mx-auto grid grid-cols-4">
      <button data-nav="today" onclick="setTab('today')" class="navbtn"><i data-lucide="sun" class="w-6 h-6"></i>Today</button>
      <button data-nav="new" onclick="startWizard()" class="navbtn"><i data-lucide="plus-circle" class="w-6 h-6"></i>New lot</button>
      <button data-nav="lots" onclick="setTab('lots')" class="navbtn"><i data-lucide="layers" class="w-6 h-6"></i>Lots</button>
      <button data-nav="more" onclick="setTab('more')" class="navbtn"><i data-lucide="menu" class="w-6 h-6"></i>More</button>
    </div>
  </nav>

  <script>
    // ---------------------------------------------------------------
    // SOURCES & THRESHOLDS
    // Each value carries its source. resolve() uses your own setting
    // first, then the selected preset, the other preset, the toolkit
    // doc and finally tool heuristics.
    // ---------------------------------------------------------------
    const SOURCE_NAMES = {
      you: 'Your setting',
      lucia: 'Lucia Solis',
      research: 'Research & references',
      toolkit: 'Toolkit doc (unsourced)',
      tool: 'Tool heuristic'
    };

    const THRESHOLDS = {
      phEndpoint:       { label: 'pH endpoint (wash / unload)', unit: '',
        lucia: [3.5, 'Making Coffee #66', 'Lucia puts a typical fermentation end near pH 3.5, starting from about 5.5–6.'], research: [4.3, 'SLACAN 2025, Arabica fermentation profile', 'In a 2025 trial, submerged washed fermentations reached pH 4.3–4.4 after 72 h (4.7–4.8 when fermented dry).'], toolkit: [4.2, 'Toolkit doc §2.1 (4.2–4.5)', 'The toolkit doc stops washed coffee at pH 4.2–4.5. It cites no source.'] },
      phFloor:          { label: 'pH low warning', unit: '',
        research: [3.5, 'Schwan & Fleet 2014, ch. 11 (working range 3.5–5.5)', 'Coffee fermentations run at about pH 3.5–5.5, so lower than 3.5 is past the normal range.'], toolkit: [4.0, 'Toolkit doc §2.1', 'The toolkit doc treats washed coffee below pH 4.0 as a defect risk. It cites no source.'] },
      tempMax:          { label: 'Fermentation temperature alert', unit: '°C',
        lucia: [30, 'Producer Toolkit #2 (Manuel Mata alert)', 'Manuel Mata gets a phone alert when a barrel in the sun climbs toward 30 °C. In the episode: "It\'s too hot."'], research: [25, 'Schwan & Fleet 2014, ch. 11 (20–25 °C)', 'Washed coffee is usually fermented under water at 20–25 °C. Higher temperatures speed fermentation up (ch. 10).'], toolkit: [25, 'Toolkit doc §2.3', 'The toolkit doc warns when sealed tanks pass 25 °C, because yeast make heat. It cites no source.'] },
      phChecksPerDay:   { label: 'pH checks a day', unit: '',
        lucia: [2, 'Producer Toolkit #3', 'Lucia checks pH at least twice a day (morning, midday and end of day). The pH meter and thermometer are "your eyes inside the fermentation".'], toolkit: [24, 'Toolkit doc §5 (hourly)', 'The toolkit doc asks for hourly readings. It cites no source.'] },
      stallPh:          { label: 'Stall: pH change under this over 12 h', unit: '',
        tool: [0.05, '', 'If pH has barely moved in 12 h, the fermentation may have stalled, and slow ferments risk butyric and propionic off-notes (Schwan & Fleet ch. 10). The 0.05 cut-off is my choice.'] },
      maxHoursOpen:     { label: 'Overdue: open tank fermentation', unit: 'h',
        lucia: [48, 'Producer Toolkit #3 (Shira 48 h trial)', 'At Shira, a washed lot went from 12 h wild to 48 h with a coffee yeast and tasted more intense. That is the longest open fermentation in her examples.'], research: [72, 'Schwan & Fleet 2014, ch. 10 (6–72 h)', 'Open fermentations take 6–72 h depending on temperature. Past 72 h is outside that range.'], toolkit: [36, 'Toolkit doc §2.1', 'The toolkit doc limit for open tanks. It cites no source.'] },
      maxHoursSealed:   { label: 'Overdue: sealed fermentation', unit: 'h',
        research: [120, 'Cenicafé SIAF study', 'In sealed tanks, over 80% of seeds were still alive at 120 h. In open tanks, about 25% were alive by 192 h. Cup scores changed little.'], toolkit: [120, 'Toolkit doc §2.3 (48–120 h)', 'The toolkit doc gives 48–120 h for sealed tanks. It cites no source.'] },
      washToDryMaxH:    { label: 'Wash to drying start limit', unit: 'h',
        research: [6, 'Schwan & Fleet 2014, ch. 10', 'Wet parchment that waits more than 6 h between washing and drying risks butyric fermentation.'] },
      pickToProcessH:   { label: 'Start processing within (from picking)', unit: 'h',
        research: [12, 'ATI Philippines 2007', 'The guide says to start processing within 12 h of harvest.'] },
      pickMaxH:         { label: 'Quality drops if pulped later than (from picking)', unit: 'h',
        research: [48, 'ATI Philippines 2007', 'Pulping delayed more than 48 h deteriorates the beans.'] },
      ripeTargetPct:    { label: 'Ripe cherry target', unit: '%',
        lucia: [80, 'Producer Toolkit #2', 'Aim for 80% red ripe, not 100%. Chasing the last 20% costs a lot and throws away good cherry.'] },
      seedMaxParchment: { label: 'Seed temperature limit: parchment', unit: '°C',
        lucia: [40, 'Producer Toolkit #2 (after Borém)', 'Lucia follows Flávio Borém: above 40 °C for long, the seed structure bursts and the coffee fades early, as if pre-aged.'], research: [40, 'Schwan & Fleet 2014, ch. 10', 'Parchment should not exceed 40 °C. Sun drying can overshoot this if the coffee is not turned or covered at midday.'] },
      seedMaxHoney:     { label: 'Seed temperature limit: honey', unit: '°C',
        lucia: [36, 'Producer Toolkit #2', 'Honeys have a lower limit than washed coffee: Lucia keeps them at or below 36 °C.'] },
      seedMaxCherry:    { label: 'Seed temperature limit: cherry', unit: '°C',
        research: [45, 'Schwan & Fleet 2014, ch. 10', 'Cherries (naturals) should not exceed 45 °C.'] },
      moistureTarget:   { label: 'Drying moisture target', unit: '%',
        lucia: [11, 'Producer Toolkit #2 (buyer spec)', 'The buyer in the episode only accepts coffee at 11%. One producer arrived at 12–12.5% and spent three days drying it at the buying station.'], research: [12, 'Schwan & Fleet 2014, ch. 10', 'About 12% keeps coffee safe in storage. In humid areas, 10–11% buys more time. Above 12% risks quality and weight loss.'], toolkit: [11, 'Toolkit doc §3 (10.5–11.5%)', 'The toolkit doc target band. It cites no source.'] },
      dryerSwitch:      { label: 'Dryer first, move to patio at', unit: '%',
        lucia: [16, 'Producer Toolkit #2', 'Use the dryer first, while the water comes off easily. Below about 20% the water is bound tightly, and heating brittle coffee makes it fade, so finish slowly on the patio from about 16%.'] },
      dryDaysNatural:   { label: 'Drying days needed: natural', unit: 'days',
        lucia: [15, 'Making Coffee #71', 'Lucia\'s shaded naturals dried in about 15 days.'], research: [12, 'Schwan & Fleet 2014, ch. 10', 'Cherries take 12–21 days on patios, depending on the climate.'] },
      dryDaysWashed:    { label: 'Drying days needed: washed', unit: 'days',
        research: [7, 'Schwan & Fleet 2014, ch. 10', 'Parchment takes 7–15 days on patios and 5–10 days on raised racks.'] },
      doseGPerKg:       { label: 'Yeast dose', unit: 'g/kg',
        lucia: [1, 'Producer Toolkit #3', 'Victor Chara uses 500 g of coffee yeast for every 500 kg of pulped coffee.'], research: [1, 'Fermentis SafCoffee data sheet', 'The label rate is 100 g per 100 kg of cherry or pulped coffee. Underdosing lets wild microbes compete.'] },
      pressureMax:      { label: 'Tank pressure limit', unit: 'PSI',
        toolkit: [15, 'Toolkit doc §2.3 (5–15 PSI)', 'The toolkit doc keeps sealed tanks at 5–15 PSI. It cites no source. Always use an airlock or valve.'] },
      // Weather and timing heuristics: starting values, editable in Settings
      rainProbPct:      { label: 'Cover when rain chance reaches', unit: '%', tool: [60, ''] },
      rainMmH:          { label: 'Cover when rain per hour reaches', unit: 'mm', tool: [0.5, ''] },
      shadeSunWm2:      { label: 'Shade when sun reaches', unit: 'W/m²', tool: [700, ''] },
      shadeAirC:        { label: 'Shade when air reaches', unit: '°C', tool: [30, ''] },
      vpdOpenKpa:       { label: 'Good open-sun drying above VPD', unit: 'kPa', tool: [0.5, ''] },
      poorShareMax:     { label: 'Natural/honey risky above this share of poor days', unit: '%', tool: [25, ''] },
      coldMillC:        { label: 'Cold mill below (72 h mean air)', unit: '°C', tool: [15, ''] },
      coverLeadMin:     { label: 'Cover reminder lead time', unit: 'min', tool: [30, ''] },
      moistureCheckH:   { label: 'Moisture check interval while drying', unit: 'h', tool: [24, ''] },
      holdHours:        { label: 'Dry reading must still hold after', unit: 'h', tool: [18, 'a "next day" check', 'Moisture evens out inside the bean as it rests (SICC), so a reading that still holds the next day is more trustworthy. 18 h is my choice.'] },
      meterSpots:       { label: 'Meter readings needed per check', unit: 'spots', tool: [3, '"several spots"', 'An average can hide uneven drying, so sample several parts of the lot (SICC). Three spots is my choice.'] },
      altitudeBand:     { label: 'Recipe matches farms within', unit: 'm', tool: [200, ''] },
    };

    function resolve(key, preset) {
      preset = preset || state.settings.preset;
      const t = THRESHOLDS[key];
      const ov = state.settings.overrides && state.settings.overrides[key];
      if (ov != null && ov !== '') return { v: Number(ov), ref: 'edited in Settings', why: 'You changed this value in Settings.', from: 'you', fallback: false };
      const order = [preset, preset === 'lucia' ? 'research' : 'lucia', 'toolkit', 'tool'];
      for (const s of order) {
        if (t[s]) return { v: t[s][0], ref: t[s][1], why: t[s][2] || '', from: s, fallback: s !== preset };
      }
      return null;
    }
    function srcLabel(r) {
      if (!r) return '';
      if (!r.ref) return SOURCE_NAMES[r.from];
      return r.from === 'tool' ? `${SOURCE_NAMES[r.from]} (${r.ref})` : `${SOURCE_NAMES[r.from]}: ${r.ref}`;
    }
    const V = key => resolve(key).v;
    // The reasoning behind a value, then its source, for why()
    function explainR(r) { return !r ? '' : r.why || (r.from === 'tool' ? 'A starting value I chose, not from a source. Change it in Settings if it doesn\'t fit your mill.' : ''); }
    function explain(r) { return r ? `${explainR(r)} ¦ ${srcLabel(r)}` : ''; }

    // ---------------------------------------------------------------
    // PROCESSES, CULTURES, CULTIVARS, REFERENCE LOTS
    // ---------------------------------------------------------------
    const METHODS = [
      { id: 'Washed', tank: true, drying: 'parchment', main: true, ref: 'washed', gloss: [3, 'The mucilage comes off before drying, by fermentation or by machine. Everything else can vary, including time.'] },
      { id: 'Natural', tank: false, drying: 'cherry', main: true, ref: 'natural', gloss: [2, 'The coffee dries with its skin and pulp on. "Natural" usually means no extra fermentation steps before drying.'] },
      { id: 'Honey', tank: false, drying: 'honey', main: true, ref: 'honey', gloss: [4, 'The skin comes off, then the coffee dries with its mucilage still attached. Feran treats honey and pulped natural as the same method.'] },
      { id: 'Anaerobic washed', tank: true, sealed: true, drying: 'parchment', ref: 'anaerobic washed', gloss: [6, 'Named for fermenting with little oxygen in a closed container. Fully oxygen-free is hard to reach, so "anoxic" is often more accurate.'] },
      { id: 'Anaerobic natural', tank: true, sealed: true, drying: 'cherry', ref: 'anaerobic natural', gloss: [6, 'Named for fermenting with little oxygen in a closed container. Fully oxygen-free is hard to reach, so "anoxic" is often more accurate.'] },
      { id: 'Carbonic maceration', tank: true, sealed: true, drying: 'cherry', ref: 'carbonic maceration', gloss: [5, 'Named after the Beaujolais winemaking practice: whole cherry sealed in a vessel flushed with CO₂, so the first fermentation happens inside the cherry.'] },
      { id: 'Other', tank: true, drying: 'parchment', ref: 'other' },
    ];
    const methodOf = id => METHODS.find(m => m.id === id) || METHODS[METHODS.length - 1];

    const BARREL_KG = 42.5; // 40–45 kg per barrel, Producer Toolkit #3

    const CULTURES = [
      { id: 'none', name: 'None (wild)', prep: () => [] },
      { id: 'rehydrate', name: 'Dry yeast, rehydrate first (e.g. SafCoffee)', needsDose: true,
        prep: (g) => [
          `Rehydrate ${fmt(g)} g of yeast in ${fmt(g * 10 / 1000, 1)} L of clean, unchlorinated water at 10–25 °C (10× its weight).`,
          'Stir gently, then rest 15–30 min.',
          'Add the starter while mixing the tank.'
        ], ref: 'The maker says to rehydrate dry yeast in 10× its weight of clean water at 10–25 °C for 15–30 min before adding it. ¦ Fermentis SafCoffee data sheet' },
      { id: 'lalcafe', name: 'LalCafé yeast (Lallemand)', needsDose: true,
        prep: (g) => [
          `Rehydrate ${fmt(g)} g of yeast in ${fmt(g * 10 / 1000, 1)} L of drinking water at 15–37 °C (10× its weight). Stir gently to break up clumps.`,
          'Wait at least 10 min, stir again, then wait 10–20 min more.',
          'After 20–30 min in all, add it while the tank fills, spread evenly.'
        ], ref: 'Lallemand says to rehydrate in 10× its weight of drinking water at 15–37 °C for 20–30 min, then add it while the tank fills so it spreads evenly. ¦ Scott Labs: LalCafé BSC and Briosa data sheets' },
      { id: 'activate', name: 'Dry yeast, warm activation (Victor Chara)', needsDose: true,
        prep: (g, kg, barrels) => [
          `Heat ${fmt(kg * 14 / 500, 1)} L of water to about 30 °C (14 L per 500 kg).`,
          `Mix in ${fmt(g)} g of yeast and let it activate for about 10 min.`,
          barrels > 1 ? `Split the solution evenly: about ${fmt(kg * 14 / 500 / barrels, 2)} L per barrel.` : 'Add all the solution to the tank and mix.'
        ], ref: 'This is Victor Chara\'s protocol in Huila: warm activation, then one litre of solution per 40–45 kg barrel. ¦ Lucia Solis: Producer Toolkit #3' },
      { id: 'direct', name: 'Direct-pitch culture (e.g. Novonesis Pichia)', needsDose: true,
        prep: (g) => [`Apply ${fmt(g)} g straight to the cherry or pulped coffee. No rehydration or waiting needed.`],
        ref: 'Some coffee cultures are made to go straight onto the coffee, with no rehydration or waiting. ¦ Lucia Solis: Producer Toolkit #3' },
      { id: 'lab', name: 'Lactic bacteria culture', needsDose: true,
        prep: (g) => [`Prepare ${fmt(g)} g following the supplier's sheet.`], ref: 'Each bacteria culture has its own preparation, so follow its sheet. ¦ Supplier data sheet' },
      { id: 'baker', name: "Baker's or beer yeast", warn: true, prep: () => [], ref: 'Bred for dough or grain, these get stressed in an acidic coffee tank and give cheesy or sulphur notes. ¦ Lucia Solis: Producer Toolkit #3' },
    ];
    const cultureOf = id => CULTURES.find(c => c.id === id) || CULTURES[0];

    // LalCafé range: [name, maker's claim, source]. All are the maker's or its distributors' words.
    const LALCAFE = [
      ['Oro', 'For mill efficiency, or for cup quality with longer fermentations. Robust at low temperatures, so it suits cool and warm climates.', 'LalCafé by Lallemand: Oro product page'],
      ['Cima', 'Brightness and citrus notes, and more mid-palate mouthfeel. Needs at least 15 °C inside the coffee mass.', 'LalCafé by Lallemand: Cima product page'],
      ['Intenso', 'Mouthfeel, floral aromas and tropical fruit notes. Builds complexity.', 'LalCafé by Lallemand: Intenso product page'],
      ['Briosa', 'Balance and mouthfeel while keeping the varietal character. Best at 18–25 °C, for 18–72 h.', 'Scott Labs: LalCafé Briosa data sheet'],
      ['BSC', 'A clean fermentation with no added flavour, to guard against spoilage. Best at 20–24 °C, at least 15 °C, for 18–48 h.', 'Scott Labs: LalCafé BSC data sheet'],
      ['Inicio', 'A reliable fermentation in any process, with a touch of fruitiness.', 'Simalem Coffee: LalCafé product list'],
      ['LDP', 'Made for the dry (natural) process.', 'Simalem Coffee: LalCafé product list'],
      ['Bacti-Fresh', 'Lactic bacteria (Lactobacillus helveticus), alone or with a LalCafé yeast. Fresh, clean, balanced acidity. Follow its own sheet: the steps here are for the yeasts.', 'Simalem Coffee: LalCafé product list'],
    ];
    const LALCAFE_TRIAL = note('amber', "These are the maker's claims. In one 2018 trial in Ethiopia, the coffee with no yeast cupped 89, above Cima (86), Intenso (84) and Oro (83.25).", 'One farm and one season: 2 kg buckets, one roast profile, two cuppers, no statistics. Treat it as a reason to run your own side-by-side, not as a verdict. ¦ The Coffee Blog: Abana trial, Gera, Ethiopia, Dec 2018');

    // Starter cultures and the flavours they push (Hackler & Särchen 2025, Tab. 6.1)
    const CULTURE_FLAVOURS = [
      ['Pichia fermentans (yeast)', 'Washed', 'Intense vanilla and floral'],

    // ---------------------------------------------------------------
    // HELPERS

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function fmt(n, d = 0) {
      if (n == null || isNaN(n)) return '–';
      return Number(n).toLocaleString(undefined, { maximumFractionDigits: d, minimumFractionDigits: 0 });
    }
    function num(v) { const n = parseFloat(v); return isNaN(n) ? null : n; }
    function uid(p) { return (p || 'x') + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
    const HOUR = 3.6e6, DAY = 864e5;
    function hoursBetween(a, b) { return (new Date(b) - new Date(a)) / HOUR; }
    function toLocalInput(d) {
      const p = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
    }
    function hm(t) { const d = new Date(t); return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
    function dayLabel(t) { return new Date(t).toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' }); }
    function when(t) {
      const now = Date.now(), d = new Date(t);
      const sameDay = new Date(now).toDateString() === d.toDateString();
      const tomorrow = new Date(now + DAY).toDateString() === d.toDateString();
      return `${sameDay ? 'today' : tomorrow ? 'tomorrow' : dayLabel(t)} ${hm(t)}`;
    }

    function icons() { if (window.lucide) lucide.createIcons(); }
    function avg(a) { const v = (a || []).filter(x => x != null); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; }
    function parseList(s) { return String(s || '').split(/[,\s;]+/).map(num).filter(x => x != null); }

      red: 'text-rose-200 bg-rose-500/10 border-rose-500/30',

      return list.map(a => `<div class="flex gap-2 border rounded-xl p-3 text-[15px] ${TONE[a.tone]}"><i data-lucide="${TONE_ICON[a.tone]}" class="w-4 h-4 flex-shrink-0 mt-0.5"></i><div><div>${esc(a.text)}</div>${why(a.ref)}</div></div>`).join('');
    }

    // Moisture from weight, assuming constant dry matter.
    function moistureAt(w0, m0, w) {
      if (!w0 || !w || m0 == null) return null;
      return (1 - (w0 * (1 - m0 / 100)) / w) * 100;
    }
    function weightAtMoisture(w0, m0, mt) {
      return w0 * (1 - m0 / 100) / (1 - mt / 100);
    }

    // ---------------------------------------------------------------
    // WEATHER (Open-Meteo)
    // ---------------------------------------------------------------
    const WX_HOURLY = 'temperature_2m,relative_humidity_2m,dew_point_2m,precipitation_probability,precipitation,cloud_cover,shortwave_radiation,wind_speed_10m,vapour_pressure_deficit,is_day';
    const WX_DAILY = 'sunrise,sunset,precipitation_probability_max,precipitation_sum,temperature_2m_max,temperature_2m_min,et0_fao_evapotranspiration';

    // Open-Meteo returns local times without an offset; convert to real instants.
    function parseLocal(s, offSec) {
      const [d, t = '00:00'] = s.split('T');
      const [y, m, dd] = d.split('-').map(Number);
      const [H, M] = t.split(':').map(Number);
      return Date.UTC(y, m - 1, dd, H, M) - offSec * 1000;
    }

    async function fetchWeather() {
      const m = state.settings.mill;
      if (m.lat == null || m.lon == null) return;
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${m.lat}&longitude=${m.lon}&hourly=${WX_HOURLY}&daily=${WX_DAILY}&timezone=auto&forecast_days=16`;
      wxStatus = 'loading'; if (!typing()) renderAll();
      try {
        const r = await fetch(url);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const j = await r.json();
        state.weather = { fetchedAt: new Date().toISOString(), lat: m.lat, lon: m.lon, raw: j };
        logLotWeather(j);
        wxStatus = 'ok';
        save();
      } catch (e) {
        wxStatus = 'error: ' + e.message;
      }
      wxCache = null;
      if (!typing()) renderAll();
    }
    let wxStatus = '';
    function typing() { return state.tab === 'new' && wiz && wiz.step !== 3; }
    let wxCache = null;

    function wx() {
      const w = state.weather;
      if (!w || !w.raw || !w.raw.hourly) return null;
      if (wxCache && wxCache.src === w) return wxCache;
      const j = w.raw, off = j.utc_offset_seconds || 0, H = j.hourly, D = j.daily;
      const hours = H.time.map((s, i) => ({
        t: parseLocal(s, off), key: s.slice(0, 10), hh: s.slice(11, 16),
        temp: H.temperature_2m[i], rh: H.relative_humidity_2m[i], dew: H.dew_point_2m[i],
        pp: H.precipitation_probability ? H.precipitation_probability[i] : null, prec: H.precipitation[i],
        cloud: H.cloud_cover[i], sw: H.shortwave_radiation[i], wind: H.wind_speed_10m[i],
        vpd: H.vapour_pressure_deficit[i], day: H.is_day[i] === 1,
      }));
      hours.forEach(h => Object.assign(h, hourMode(h)));
      const days = D.time.map((s, i) => {
        const dh = hours.filter(h => h.key === s && h.day);
        const dry = dh.filter(h => h.mode === 'open' || h.mode === 'shade').length;
        const wet = dh.filter(h => h.mode === 'cover').length;
        const outlook = dry >= 6 && wet <= 1 ? 'good' : (dry < 3 || wet >= 4) ? 'poor' : 'fair';
        return {
          key: s, sunrise: parseLocal(D.sunrise[i], off), sunset: parseLocal(D.sunset[i], off),
          ppMax: D.precipitation_probability_max ? D.precipitation_probability_max[i] : null, precSum: D.precipitation_sum[i],
          tmax: D.temperature_2m_max[i], tmin: D.temperature_2m_min[i], et0: D.et0_fao_evapotranspiration[i],
          dry, wet, outlook,
        };
      });
      wxCache = { src: w, hours, days, tz: j.timezone, elevation: j.elevation };
      return wxCache;
    }

    // One drying mode per hour. Night: piled and covered (ATI Philippines 2007;
    // Hackler & Särchen 2025). Daytime thresholds are tool heuristics.
    function hourMode(h) {
      if (!h.day) return { mode: 'night', why: 'Night: piled and covered' };
      if ((h.pp != null && h.pp >= V('rainProbPct')) || (h.prec != null && h.prec >= V('rainMmH'))) {
        return { mode: 'cover', why: `Rain likely (${fmt(h.pp)}%, ${fmt(h.prec, 1)} mm)` };
      }
      if ((h.sw != null && h.sw >= V('shadeSunWm2')) || (h.temp != null && h.temp >= V('shadeAirC'))) {
        return { mode: 'shade', why: `Strong sun or heat (${fmt(h.sw)} W/m², ${fmt(h.temp)} °C)` };
      }
      if (h.vpd != null && h.vpd >= V('vpdOpenKpa')) return { mode: 'open', why: `Good drying air (VPD ${fmt(h.vpd, 2)} kPa)` };
      return { mode: 'slow', why: `Humid air, slow drying (VPD ${fmt(h.vpd, 2)} kPa)` };
    }
    const MODE_LABEL = { open: 'Open sun', shade: 'Shade', slow: 'Slow / humid', cover: 'Cover', night: 'Night (piled)' };
    const MODE_ACTION = {
      open: 'Spread thin and rake on schedule.',
      shade: 'Shade cloth on, rake more often to cool the seed.',
      slow: 'Thin layers and more raking for airflow. Consider the dryer early.',
      cover: 'Pile and cover before it starts. Do not let rain re-wet the coffee.',
      night: 'Piled and covered for the night.',
    };

    function wxSummary(hoursAhead) {
      const w = wx(); if (!w) return null;
      const now = Date.now();
      const next = w.hours.filter(h => h.t >= now - HOUR && h.t <= now + (hoursAhead || 72) * HOUR);
      const days = w.days.filter(d => d.sunset >= now);
      const good = days.filter(d => d.outlook === 'good').length;
      const fair = days.filter(d => d.outlook === 'fair').length;
      const poor = days.filter(d => d.outlook === 'poor').length;
      return {
        meanT: avg(next.map(h => h.temp)), maxT: next.length ? Math.max(...next.map(h => h.temp)) : null,
        days, good, fair, poor, n: days.length,
      };
    }
    function sunTimes(ts) {
      const w = wx();
      if (w) {
        const d = w.days.find(x => ts >= x.sunrise - 6 * HOUR && ts < x.sunrise + 18 * HOUR);
        if (d) return { sunrise: d.sunrise, sunset: d.sunset };
      }
      const a = new Date(ts); a.setHours(6, 0, 0, 0);
      const b = new Date(ts); b.setHours(18, 0, 0, 0);
      return { sunrise: a.getTime(), sunset: b.getTime(), guessed: true };
    }

    // ---------------------------------------------------------------
    // PROCESS SUGGESTION
    // ---------------------------------------------------------------
    function cultivarOf(name) {
      if (!name) return null;
      const n = name.trim().toLowerCase();
      return state.cultivars.find(c => c.name.toLowerCase() === n) || null;
    }
    function ripeInfo(b) {
      const c = b.counts || {};
      const total = (c.green || 0) + (c.hard || 0) + (c.soft || 0) + (c.over || 0);
      return { total, ripePct: total ? ((c.hard || 0) + (c.soft || 0)) / total * 100 : null, over: c.over || 0 };
    }
    function matchingRecipes(cultivar, masl) {
      if (!cultivar) return [];
      const band = V('altitudeBand');
      return state.recipes.filter(r => r.cultivar && r.cultivar.toLowerCase() === cultivar.trim().toLowerCase()
        && (masl == null || r.masl == null || Math.abs(r.masl - masl) <= band));
    }

    function suggest(b) {
      const general = [];
      const S = state.settings;
      const preset = S.preset;
      const sum = wxSummary(72);

      // Time from picking (ATI Philippines 2007)
      if (b.pickedAt) {
        const age = hoursBetween(b.pickedAt, b.arrivedAt || new Date());
        const soon = resolve('pickToProcessH'), max = resolve('pickMaxH');
        if (age > max.v) general.push(note('red', `Picked ${fmt(age)} h ago. Pulping later than ${max.v} h lowers quality.`, explain(max)));
        else if (age > soon.v) general.push(note('amber', `Picked ${fmt(age)} h ago. Processing should start within ${soon.v} h of picking.`, explain(soon)));
      }
      if (b.container === 'sacks') general.push(note('amber', 'Arrived in sacks. Heavy sacks crush the fruit, leak juice and heat up. Ventilated, stackable baskets of 18–23 kg protect it.', 'Under the weight of a full sack, cherries break and leak juice, which starts a fermentation you didn\'t ask for. Ventilated baskets keep them cooler and stack without crushing. ¦ Lucia Solis: Producer Toolkit #7'));
      if (b.crushed || b.warm) general.push(note('amber', `Cherry arrived ${[b.crushed && 'crushed', b.warm && 'warm'].filter(Boolean).join(' and ')}. Uncontrolled fermentation may already have started.`, 'Broken, leaking or warm fruit has already started fermenting with whatever microbes are around, before you can control it. ¦ Lucia Solis: Producer Toolkit #7'));

      // Ripeness
      const ri = ripeInfo(b);
      const tgt = resolve('ripeTargetPct');
      const lowRipe = (ri.ripePct != null && ri.ripePct < tgt.v) || ['mixed', 'early', 'late'].includes(b.ripeness);
      if (ri.ripePct != null) general.push(note(ri.ripePct >= tgt.v ? 'green' : 'amber', `Ripe ${fmt(ri.ripePct)}% on the classifier board (target ${tgt.v}%).`, explain(tgt)));
      if (lowRipe) general.push(note('amber', 'Lower-quality or mixed cherry: commercial microbes give the biggest lift here (one lot went from 82 to 85), and little on lots already at 89 or more. Remove floaters and overripe cherry first.', 'Commercial microbes lifted an 82-point coffee to 85, but rarely help a coffee already at 89–90. Floating removes the dry and overripe fruit that floats. ¦ Lucia Solis: Producer Toolkit #3 and #2'));

      // Altitude vs cultivar
      const cv = cultivarOf(b.cultivar);
      if (cv && b.masl != null && cv.optMin != null && b.masl < cv.optMin) {
        general.push(note('amber', `Farm at ${fmt(b.masl)} m is below ${cv.name}'s optimal ${fmt(cv.optMin)}${cv.optMax ? '–' + fmt(cv.optMax) : '+'} m. Controlled fermentation with regular pH checks can narrow the gap for lower farms.`, 'Each cultivar has an altitude range where it does best, from the World Coffee Research catalogue (you enter it). Lucia says better fermentation control can help lower farms close part of the gap. ¦ World Coffee Research catalog (your entry); Making Coffee #59'));
      }

      // Mill temperature from the forecast
      if (sum && sum.meanT != null) {
        const cold = resolve('coldMillC'), hot = resolve('tempMax');
        if (sum.meanT < cold.v) general.push(note('amber', `Cold mill: the next 72 h average ${fmt(sum.meanT, 1)} °C. Expect a longer fermentation (6–72 h depending on temperature). If tank space is short, a commercial yeast selected for cold cut one mill's fermentations from 100 h to 24 h.`, `Fermentation takes 6–72 h depending on temperature, and colder is slower. At a cold mill, tanks stayed busy 100 h until a cold-tolerant coffee yeast cut it to 24 h. ${explainR(cold)} ¦ Schwan & Fleet 2014, ch. 10; Producer Toolkit #3; cold line: ${srcLabel(cold)}`));
        if (sum.maxT >= hot.v) general.push(note('amber', `Hot spell: air reaches ${fmt(sum.maxT, 1)} °C in the next 72 h. Plan a shorter fermentation and keep tanks in shade.`, `Higher temperatures speed fermentation up, so it can overshoot between checks. ${explainR(hot)} ¦ ${srcLabel(hot)}; Schwan & Fleet 2014, ch. 10`));
      } else {
        general.push(note('info', 'Set the mill location in Settings to get weather-based advice.', ''));
      }

      // Rank processes
      const runs = S.processes && S.processes.length ? S.processes : ['Washed', 'Natural', 'Honey'];
      let order = preset === 'research' ? ['Washed', 'Honey', 'Natural'] : ['Washed', 'Natural', 'Honey'];
      order = order.filter(m => runs.includes(m));
      if (b.experiment) order = order.concat(['Anaerobic washed', 'Anaerobic natural', 'Carbonic maceration']);
      const poorMax = resolve('poorShareMax');
      const ranked = order.map(id => {
        const notes = []; let ok = true;
        if (id === 'Washed') notes.push(note('info', 'Washed processing gives better control and generally fewer defects than naturals.', 'The fruit and mucilage come off before drying, and washed coffee dries faster than a natural. ¦ Hackler & Särchen 2025, ch. 5–6'));
        if (id === 'Natural' || id === 'Honey' || id === 'Anaerobic natural' || id === 'Carbonic maceration') {
          const need = resolve('dryDaysNatural');
          if (sum) {
            const share = sum.n ? sum.poor / sum.n * 100 : 0;
            const what = id === 'Honey' ? 'A honey' : 'A natural';
            const reason = `${explainR(need)}${id === 'Honey' ? ' A honey can dry even slower than a natural.' : ''}`, ref = `days: ${srcLabel(need)}${id === 'Honey' ? '; honey: Lucia Solis, Producer Toolkit #2' : ''}`;
            if (share > poorMax.v) {
              ok = false;
              notes.push(note('amber', `${sum.poor} of the next ${sum.n} days look poor for drying (${fmt(share)}%). ${what} needs about ${need.v}+ days of drying.`, `A natural or honey sits on the beds for weeks, and long stretches of wet weather mean mould risk. ${reason} The ${poorMax.v}% cut-off is my choice. ¦ ${ref}; cut-off: ${srcLabel(poorMax)}`));
            } else {
              notes.push(note('green', `${sum.good} good, ${sum.fair} fair and ${sum.poor} poor drying days in the next ${sum.n}. ${what} needs about ${need.v}+ days of drying.`, `A natural or honey needs many dry days in a row. The forecast looks good enough for that. ${reason} ¦ Forecast: Open-Meteo; ${ref}`));
            }
          }
          if ((id === 'Natural' || id === 'Anaerobic natural' || id === 'Carbonic maceration') && (ri.over > 0 || b.ripeness === 'late')) notes.push(note('amber', 'Sort out overripe cherry before a natural.', 'Lucia\'s episode on "de-funkifying" naturals starts with sorting out overripe cherry. ¦ Making Coffee #71'));
        }
        if (id === 'Honey') {
          notes.push(preset === 'research'
            ? note('info', 'Turned daily, honey has a much lower defect risk than a natural.', 'Part of the pulp comes off before drying, unlike a natural, and the book rates its defect risk much lower. ¦ Hackler & Särchen 2025, ch. 5')
            : note('amber', 'The hardest process: the mucilage is exposed as in a washed, and it can dry even slower than a natural.', 'Lucia calls honey the hardest process: it has the worst part of a washed (exposed, sugary mucilage) and of a natural (slow drying). ¦ Lucia Solis: Producer Toolkit #2'));
          const seed = resolve('seedMaxHoney');
          if (!S.setup.shade) notes.push(note('amber', `Needs shade cloth to keep the seed at or below ${seed.v} °C. Your setup has none.`, explain(seed)));
        }
        if (id === 'Washed' && sum && sum.n && sum.poor / sum.n > 0.5) notes.push(note('amber', 'More than half the forecast days are poor. Even washed coffee will dry slowly.', 'Slow drying keeps the seed moist for longer, which brings a risk of mould (Producer Toolkit #2). The "more than half" cut-off is my choice. ¦ Tool heuristic'));
        if (['Anaerobic washed', 'Anaerobic natural', 'Carbonic maceration'].includes(id)) notes.push(note('info', 'Offered because you marked this lot as an experiment.', 'Sealed and anaerobic methods are only shown when you ask for them, because they need more control and more checks. ¦ Design choice'));
        return { id, ok, notes };
      });
      ranked.sort((a, c) => (c.ok - a.ok));
      return { general, ranked, recipes: matchingRecipes(b.cultivar, b.masl), cultivar: cv };
    }

    // ---------------------------------------------------------------
    // LOT STATUS, ALERTS, READY CHECKS
    // ---------------------------------------------------------------
    function lotStage(l) {
      if (l.bag) return 'resting';
      if (l.drying && l.drying.startAt) return 'drying';
      if (methodOf(l.method).tank && !l.washedAt) return 'fermenting';
      return 'to dry';
    }
    const STAGE_STYLE = {
      fermenting: 'bg-amber-500/10 text-amber-300 border-amber-500/30',
      'to dry': 'bg-orange-500/10 text-orange-300 border-orange-500/30',
      drying: 'bg-cyan-500/10 text-cyan-300 border-cyan-500/30',
      resting: 'bg-emerald-500/10 text-emerald-300 border-emerald-500/30',
    };
    function maxHoursFor(l) {
      const m = methodOf(l.method);
      if (!m.tank) return null;
      return m.sealed ? resolve('maxHoursSealed') : resolve('maxHoursOpen');
    }
    function seedLimitFor(type) {
      return resolve(type === 'honey' ? 'seedMaxHoney' : type === 'cherry' ? 'seedMaxCherry' : 'seedMaxParchment');
    }
    function readingsOf(l) { return (l.readings || []).slice().sort((a, c) => new Date(a.at) - new Date(c.at)); }
    function fermentHours(l, r) { return hoursBetween(l.fermentStart || l.createdAt, r ? r.at : (l.washedAt || new Date())); }

    function fermentReady(l) {
      const end = resolve('phEndpoint');
      const rs = readingsOf(l);
      const last = rs[rs.length - 1];
      const needHand = methodOf(l.method).drying === 'parchment';
      const ph = !!(last && last.ph != null && last.ph <= end.v), hand = !!(last && last.hand);
      return { end, last, ph, hand, needHand, ready: ph && (hand || !needHand) };
    }

    function dryingInfo(l) {
      const d = l.drying || {};
      const ws = (d.weighings || []).slice().sort((a, c) => new Date(a.at) - new Date(c.at));
      const target = d.target != null ? d.target : V('moistureTarget');
      const ref = ws.find(w => w.weight != null && avg(w.meter) != null);
      const pts = ref ? ws.filter(w => w.weight != null && new Date(w.at) >= new Date(ref.at)).map(w => ({ at: w.at, m: moistureAt(ref.weight, avg(ref.meter), w.weight), w: w.weight })) : [];
      const targetW = ref ? weightAtMoisture(ref.weight, avg(ref.meter), target) : null;
      const last = ws[ws.length - 1];
      const spots = resolve('meterSpots'), hold = resolve('holdHours');
      const meterOk = !!(last && last.meter && last.meter.length >= spots.v && last.meter.every(x => x <= target));
      const earlier = last ? ws.filter(w => w !== last && w.meter && w.meter.length && avg(w.meter) <= target && hoursBetween(w.at, last.at) >= hold.v) : [];
      const holdOk = meterOk && earlier.length > 0;
      const brittle = !!(last && last.brittle);
      let eta = null;
      if (pts.length >= 2) {
        const a = pts[pts.length - 2], c = pts[pts.length - 1];
        const rate = (a.m - c.m) / hoursBetween(a.at, c.at);
        if (rate > 0 && c.m > target) eta = new Date(new Date(c.at).getTime() + (c.m - target) / rate * HOUR);
      }
      const estNow = pts.length ? pts[pts.length - 1].m : (last && avg(last.meter));
      return { ws, target, ref, pts, targetW, last, meterOk, holdOk, brittle, ready: meterOk && holdOk && brittle, eta, estNow, spots, hold };
    }

    function lotAlerts(l) {
      const out = [];
      const st = lotStage(l);
      const S = state.settings;
      const c = cultureOf(l.culture);
      if (c.warn) out.push(note('red', "Baker's or beer yeast in use. In coffee they tend to give stress compounds such as cheesy or sulphur notes.", 'Bread and beer yeasts are bred for warm dough or grain sugars. A coffee tank is acidic, has little oxygen and holds fruit sugars, so they get stressed and make sulphur compounds. ¦ Lucia Solis: Producer Toolkit #3'));
      if (c.needsDose && l.labelDose != null && l.dose != null && l.dose < l.labelDose) out.push(note('amber', `Dose ${fmt(l.dose, 2)} g/kg is below the label ${fmt(l.labelDose, 2)} g/kg. Underdosing lets wild microbes compete.`, 'Too little starter lets the wild microbes already on the fruit compete with it, so you lose the control you paid for. ¦ Lucia Solis: Producer Toolkit #3; Fermentis'));
      const chk = l.checklist || {};
      const missing = [['water', 'unchlorinated water'], ['clean', 'clean tanks'], ['soap', 'no scented soap'], ['calib', 'pH meter calibrated'], ['smell', 'no smoke, fuel or kitchen smells nearby']].filter(([k]) => !chk[k]).map(([, t]) => t);
      if (!l.sample && missing.length && st === 'fermenting') out.push(note('amber', `Not confirmed: ${missing.join(', ')}.`, 'Chlorine kills the microbes you add, coffee soaks up scents like a sponge, and an uncalibrated pH meter gives you wrong endpoints. ¦ Lucia Solis: Producer Toolkit #3 and #7'));

      if (st === 'fermenting') {
        const rs = readingsOf(l), last = rs[rs.length - 1];
        const fr = fermentReady(l);
        const floor = resolve('phFloor'), tMax = resolve('tempMax');
        if (last) {
          if (last.temp != null && last.temp > tMax.v) out.push(note('red', `Tank at ${fmt(last.temp, 1)} °C, above ${tMax.v} °C. Shade or cool it.`, explain(tMax)));
          if (c.id === 'lalcafe' && last.temp != null && last.temp < 15) out.push(note('amber', `Tank at ${fmt(last.temp, 1)} °C, below the 15 °C LalCafé needs to take hold. Move it somewhere warmer.`, 'Lallemand gives 15 °C inside the coffee as the minimum for its yeasts to establish. ¦ LalCafé by Lallemand: Cima and BSC pages'));
          if (last.psi != null && last.psi > V('pressureMax')) out.push(note('red', `Pressure ${fmt(last.psi, 1)} PSI is above ${V('pressureMax')} PSI. Vent the tank.`, explain(resolve('pressureMax'))));
          if (last.ph != null && last.ph < floor.v) out.push(note('red', `pH ${fmt(last.ph, 2)} is below ${floor.v}. Risk of over-fermentation.`, explain(floor)));
          else if (fr.ph) out.push(note('green', `pH ${fmt(last.ph, 2)} has reached the ${fr.end.v} endpoint. Do the hand test, then wash or unload.`, explain(fr.end)));
          if (fr.hand) out.push(note('green', 'Hand test passed: the parchment feels gritty, like pebbles. Wash now.', 'Schwan & Fleet 2014, ch. 10'));
          const prior = rs.filter(r => r.ph != null && hoursBetween(r.at, last.at) >= 12).pop();
          if (prior && last.ph != null && (prior.ph - last.ph) < V('stallPh') && last.ph > fr.end.v) out.push(note('amber', `pH has barely moved in ${fmt(hoursBetween(prior.at, last.at))} h (${fmt(prior.ph, 2)} → ${fmt(last.ph, 2)}). Slow ferments risk butyric and propionic off-notes.`, 'When fermentation is too slow, butyric or propionic acid can build up, and both hurt quality. ¦ Schwan & Fleet 2014, ch. 10'));
        }
        const maxH = maxHoursFor(l);
        const limit = l.expectedHours || (maxH && maxH.v);
        const h = fermentHours(l);
        if (limit && h > limit) out.push(note('amber', `Fermenting for ${fmt(h)} h, past the expected ${limit} h.`, l.expectedHours ? 'The hours you planned for this lot. ¦ Your plan' : explain(maxH)));
        if (!S.thermometer) {
          const sum = wxSummary(24);
          if (sum && sum.maxT != null && sum.maxT >= tMax.v - 5) out.push(note('amber', `No tank thermometer: forecast air reaches ${fmt(sum.maxT, 1)} °C, and a fermenting mass can run warmer than the air.`, 'Microbes give off heat as they work, so the tank can be warmer than the forecast air. ¦ Forecast: Open-Meteo; Schwan & Fleet 2014, ch. 10'));
        }
      }
      if (st === 'to dry' && l.washedAt) {
        const wd = resolve('washToDryMaxH');
        const gap = hoursBetween(l.washedAt, new Date());
        if (gap > wd.v && !l.sample) out.push(note('amber', `Washed ${fmt(gap, 1)} h ago and drying hasn't started (limit ${wd.v} h).`, explain(wd)));
      }
      if (st === 'drying') {
        const di = dryingInfo(l);
        const seed = seedLimitFor(methodOf(l.method).drying);
        const lastSeed = di.ws.filter(w => w.seedTemp != null).pop();
        if (lastSeed && lastSeed.seedTemp > seed.v) out.push(note('red', `Seed at ${fmt(lastSeed.seedTemp, 1)} °C, above ${seed.v} °C. Shade it or lower the dryer air.`, explain(seed)));
        if (di.ready) out.push(note('green', `Dry: every meter reading is at or below ${di.target}%, it held over ${di.hold.v} h, and it feels hard and brittle. Bag it.`, explain(resolve('moistureTarget'))));
      }
      if (st === 'resting' && l.bag && l.bag.type !== 'barrier') {
        out.push(note('amber', l.bag.type === 'jute'
          ? 'Stored in jute: coffee can take moisture back up to 15% and pick up a "baggy" taste. Use barrier bags (polyethylene plus EVOH).'
          : 'Plain polyethylene stops moisture but lets oxygen through, so the coffee ages faster. Barrier bags stop both.', 'Polyethylene is good at stopping moisture but not oxygen. EVOH stops oxygen but not moisture, so barrier bags layer both. ¦ Lucia Solis: Producer Toolkit #7'));
      }
      return out;
    }

    // ---------------------------------------------------------------
    // REMINDERS
    // ---------------------------------------------------------------
    const REM_ICON = { ph: 'test-tube', rake: 'grip-horizontal', spread: 'sunrise', pile: 'sunset', cover: 'umbrella', uncover: 'sun', 'shade-on': 'cloud-sun', 'shade-off': 'sun', moisture: 'droplets', drystart: 'timer', recheck: 'package' };

    function actionDone(l, kind, at) {
      return (l.actions || []).some(a => a.kind === kind && Math.abs(new Date(a.at) - at) < 3 * HOUR);
    }
    function lastAction(l, kind) {
      const a = (l.actions || []).filter(x => x.kind === kind).map(x => new Date(x.at).getTime());
      return a.length ? Math.max(...a) : null;
    }

    function lotReminders(l, horizonH) {
      const now = Date.now(), end = now + (horizonH || 36) * HOUR, from = now - 6 * HOUR;
      const out = [];
      const st = lotStage(l);
      const S = state.settings;
      const add = (kind, at, text, ref) => { if (at >= from && at <= end && !actionDone(l, kind, at)) out.push({ lot: l, kind, at, text, ref }); };
      if (l.sample) return out;

      if (st === 'fermenting') {
        const rs = readingsOf(l);
        const base = rs.length ? new Date(rs[rs.length - 1].at).getTime() : new Date(l.fermentStart || l.createdAt).getTime();
        const iv = resolve('phChecksPerDay');
        const at = Math.max(nextPhCheck(base + 3 * HOUR, iv.v), now - 6 * HOUR);
        out.push({ lot: l, kind: 'ph', at, text: `Check pH${S.thermometer ? ' and tank temperature' : ''}${methodOf(l.method).drying === 'parchment' ? ', and do the hand test' : ''}`, ref: explain(iv) });
      }
      if (st === 'to dry' && l.washedAt) {
        const wd = resolve('washToDryMaxH');
        add('drystart', new Date(l.washedAt).getTime() + wd.v * HOUR, 'Start drying (limit after washing)', explain(wd));
      }
      if (st === 'drying') {
        // Spread at sunrise, pile and cover before sunset (ATI Philippines 2007)
        for (let k = 0; k < 3; k++) {
          const s = sunTimes(now + (k - 1) * DAY + 12 * HOUR);
          add('spread', s.sunrise, 'Spread the coffee out', 'Spread in thin layers, about 10 cm, each morning after the night under cover. ¦ ATI Philippines 2007; Schwan & Fleet 2014, ch. 10');
          add('pile', s.sunset - V('coverLeadMin') * 60000, 'Pile and cover for the night', 'Piled and covered, the coffee is protected from dew and rain overnight. ¦ ATI Philippines 2007; Schwan & Fleet 2014, ch. 10');
        }
        // Raking 8–10 times a day (Schwan & Fleet ch. 10), spread across daylight
        const s0 = sunTimes(now);
        const iv = (s0.sunset - s0.sunrise) / 9;
        const lr = lastAction(l, 'rake');
        let next = Math.max(lr ? lr + iv : now, now);
        for (let k = 0; k < 2; k++) {
          const s = sunTimes(next);
          if (next < s.sunrise) next = s.sunrise + iv / 2;
          if (next > s.sunset) { const t = sunTimes(next + 12 * HOUR); next = t.sunrise + iv / 2; }
          if (next <= end) out.push({ lot: l, kind: 'rake', at: next, text: 'Rake', ref: 'Raking turns the layer so it dries evenly and doesn\'t overheat on top. The book says 8–10 times a day. ¦ Schwan & Fleet 2014, ch. 10' });
          break;
        }
        // Rain and shade blocks from the forecast
        const w = wx();
        if (w) {
          const hs = w.hours.filter(h => h.t >= now - HOUR && h.t <= end && h.day);
          const blocks = [];
          hs.forEach(h => {
            const b = blocks[blocks.length - 1];
            if (b && b.mode === h.mode && h.t - b.end <= HOUR) b.end = h.t + HOUR; else blocks.push({ mode: h.mode, start: h.t, end: h.t + HOUR });
          });
          blocks.forEach(b => {
            if (b.mode === 'cover') {
              add('cover', b.start - V('coverLeadMin') * 60000, `Rain likely ${hm(b.start)}–${hm(b.end)}: pile and cover`, 'Wet coffee on the beds takes longer to dry and risks mould. The rain timing comes from the forecast. ¦ Forecast: Open-Meteo; Schwan & Fleet 2014, ch. 10');
              if (b.end < sunTimes(b.end).sunset - V('coverLeadMin') * 60000) add('uncover', b.end, 'Rain passing: spread out again', 'Every dry hour counts, so spread it out again once the rain has passed. ¦ Forecast: Open-Meteo');
            }
            if (b.mode === 'shade' && S.setup.shade) {
              add('shade-on', b.start, `Strong sun ${hm(b.start)}–${hm(b.end)}: shade cloth on`, 'Midday sun can push the seed past 40 °C. Shade lowers the peak, and Lucia\'s shaded naturals still dried in about 15 days. ¦ Lucia Solis: Producer Toolkit #2; Making Coffee #71');
              add('shade-off', b.end, 'Shade cloth off', 'Once the strong sun has passed, open sun dries faster again. ¦ Forecast: Open-Meteo');
            }
          });
        }
        // Moisture checks
        const di = dryingInfo(l);
        const lw = di.last ? new Date(di.last.at).getTime() : new Date(l.drying.startAt).getTime();
        const near = di.estNow != null && di.estNow <= di.target + 2;
        const ivm = resolve('moistureCheckH').v * (near ? 0.5 : 1);
        let mAt = Math.max(lw + ivm * HOUR, now - 6 * HOUR);
        const ms = sunTimes(mAt);
        // Weigh in daylight, while the coffee is spread out
        if (mAt < ms.sunrise) mAt = ms.sunrise + HOUR; else if (mAt > ms.sunset - HOUR) mAt = sunTimes(mAt + 12 * HOUR).sunrise + HOUR;
        out.push({ lot: l, kind: 'moisture', at: mAt, text: near ? 'Near target: meter readings in several spots, weigh, feel for brittle' : 'Weigh and take meter readings', ref: explain(resolve('moistureCheckH')) });
      }
      if (st === 'resting') {
        const b0 = new Date(l.bag.at).getTime();
        const lr = lastAction(l, 'recheck');
        const at = (lr || b0) + 30 * DAY;
        add('recheck', at, 'Re-check moisture in storage', 'Tool heuristic (monthly)');
      }
      return out.filter(r => r.at <= end).sort((a, c) => a.at - c.at);
    }
    // pH check times: morning and end of day (plus midday for 3 a day), or evenly spaced for more
    function nextPhCheck(after, perDay) {
      for (let k = 0; k < 3; k++) {
        const st = sunTimes(after + k * DAY);
        const mid = (st.sunrise + st.sunset) / 2;
        const slots = perDay >= 4 ? Array.from({ length: Math.round(perDay) }, (_, i) => st.sunrise - 6 * HOUR + i * DAY / Math.round(perDay))

    function lineChart(points, opts) {
      const W = 320, H = 150, L = 36, R = 10, T = 12, B = 24;
      const pts = points.filter(p => p.y != null && p.x != null);
      if (pts.length === 0) {
        return `<div class="card !p-3"><div class="text-xs font-mono text-coffee-400 mb-1">${esc(opts.title)}</div><div class="h-[110px] flex items-center justify-center text-xs text-coffee-500">No readings yet</div></div>`;
      }
      const xMax = Math.max(...pts.map(p => p.x), opts.xMin || 1);
      const ys = pts.map(p => p.y);
      (opts.lines || []).forEach(l => ys.push(l.y));
      let yMin = Math.min(...ys), yMax = Math.max(...ys);
      if (yMin === yMax) { yMin -= 1; yMax += 1; }
      const pad = (yMax - yMin) * 0.1; yMin -= pad; yMax += pad;
      const sx = x => L + (x / xMax) * (W - L - R);
      const sy = y => T + (1 - (y - yMin) / (yMax - yMin)) * (H - T - B);
      const path = pts.map((p, i) => `${i ? 'L' : 'M'}${sx(p.x).toFixed(1)},${sy(p.y).toFixed(1)}`).join(' ');
      let svg = `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto max-h-[240px]" role="img" aria-label="${esc(opts.title)}">`;
      [yMin + pad, (yMin + yMax) / 2, yMax - pad].forEach(t => { svg += `<line x1="${L}" x2="${W - R}" y1="${sy(t)}" y2="${sy(t)}" stroke="#4B3520" stroke-width="0.5"/><text x="${L - 4}" y="${sy(t) + 3}" text-anchor="end" font-size="9" fill="#9E8057" font-family="JetBrains Mono">${fmt(t, opts.dp || 0)}</text>`; });
      [0, xMax / 2, xMax].forEach(t => { svg += `<text x="${sx(t)}" y="${H - 8}" text-anchor="middle" font-size="9" fill="#9E8057" font-family="JetBrains Mono">${fmt(t)}${opts.xUnit || 'h'}</text>`; });
      (opts.lines || []).forEach(l => { svg += `<line x1="${L}" x2="${W - R}" y1="${sy(l.y)}" y2="${sy(l.y)}" stroke="${l.color}" stroke-width="1" stroke-dasharray="4 3"/><text x="${W - R}" y="${sy(l.y) - 3}" text-anchor="end" font-size="8.5" fill="${l.color}" font-family="JetBrains Mono">${esc(l.label)}</text>`; });
      svg += `<path d="${path}" fill="none" stroke="${opts.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      pts.forEach(p => { svg += `<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="2.5" fill="${opts.color}"><title>${fmt(p.x, 1)}: ${fmt(p.y, opts.dp || 1)}</title></circle>`; });
      svg += `</svg>`;
      return `<div class="card !p-3"><div class="text-xs font-mono text-coffee-400 mb-1">${esc(opts.title)}</div>${svg}</div>`;
    }

    function computePlan(p) {
      const kg = p.kg || 0;

      const grams = culture.needsDose ? dose * kg : 0;
      const barrels = p.container === 'barrel' ? Math.max(1, Math.ceil(kg / BARREL_KG)) : 1;
      const out = { kg, culture, dose, grams, barrels, steps: [], warnings: [], notes: [] };
      if (culture.needsDose) out.steps = culture.prep(grams, kg, barrels);
      if (culture.warn) out.warnings.push("Baker's and beer yeast are made for grain sugars and oxygen. In coffee they tend to produce stress compounds such as cheesy or sulphur notes (Producer Toolkit #3).");
      if (culture.needsDose && p.labelDose != null && dose < p.labelDose) out.warnings.push(`Dose is below the label rate (${fmt(dose, 2)} vs ${fmt(p.labelDose, 2)} g/kg). Underdosing lets wild microbes compete (Producer Toolkit #3).`);
      if (p.container === 'barrel' && kg > 900) out.notes.push('Over about 900 kg (2,000 lb) a day, one larger tank is usually easier to manage than many barrels (Producer Toolkit #3).');
