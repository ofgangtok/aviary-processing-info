        <div class="flex flex-wrap gap-2 mb-3">${cats.map(c => chip(c, f === c, `state.refFilter='${c}';renderAll()`)).join('')}</div>
        <div class="space-y-2">${refs.map(x => `<div class="card space-y-1">
          <div class="text-white font-semibold">${esc(x.lot)}</div>
          <div class="text-sm text-coffee-400">${esc(x.o)} · ${esc(x.p)} · <a class="underline" href="${x.u}" target="_blank" rel="noopener">${esc(x.r)}</a></div>
          <p class="text-[15px] text-coffee-200"><span class="text-coffee-400">Fermentation:</span> ${esc(x.f)}</p>
          <p class="text-[15px] text-coffee-200"><span class="text-coffee-400">Drying:</span> ${esc(x.d)}</p>
          ${x.t ? `<p class="text-[15px] text-coffee-200"><span class="text-coffee-400">Cup:</span> ${esc(x.t)}${x.s ? ` · ${fmt(x.s, 2)} pts` : ''}</p>` : ''}
        </div>`).join('')}</div>
        ${heading('Starter cultures and the flavours they push')}
        <div class="card space-y-2">${CULTURE_FLAVOURS.map(r => `<div class="inline-why text-[15px] text-coffee-200"><span class="text-white">${esc(r[0])}</span> · ${esc(r[1])}: ${esc(r[2])}</div>`).join('')}<div class="inline-why text-xs text-coffee-400">Research examples, not guarantees.${why('Each culture makes its own set of aroma building blocks. The book shows what trials found, but the links are complex and are examples for that process only. ¦ Hackler & Särchen 2025, Tab. 6.1')}</div></div>`;
    }

    function renderSettingsPage() {
      const S = state.settings, m = S.mill, su = S.setup;
      const cb = (path, val, label) => `<label class="chk-lg"><input type="checkbox" ${val ? 'checked' : ''} onchange="setSetting('${path}', this.checked)"> ${label}</label>`;
      return `${heading('Mill')}
        <div class="card space-y-3">
          <input value="${esc(m.name)}" placeholder="Mill name" class="field-lg" onchange="setSetting('mill.name', this.value)">
          <div class="grid grid-cols-2 gap-2"><input type="number" step="any" inputmode="decimal" value="${m.lat ?? ''}" placeholder="Latitude" class="field-lg" onchange="setSetting('mill.lat', num(this.value))"><input type="number" step="any" inputmode="decimal" value="${m.lon ?? ''}" placeholder="Longitude" class="field-lg" onchange="setSetting('mill.lon', num(this.value))"></div>
          <button onclick="useMyLocation()" class="btn-big ghost"><i data-lucide="locate" class="w-5 h-5"></i> Use my location</button>
          <p class="text-sm text-coffee-400">${esc(wxStatus.startsWith('error') ? 'Could not reach the weather service.' : '')} Only the location is sent to the weather service. Everything else stays on this phone.</p>
        </div>
        ${heading('How you dry')}
        <div class="card space-y-2">${cb('setup.patio', su.patio, 'Patio')}${cb('setup.beds', su.beds, 'Raised beds')}${cb('setup.shade', su.shade, 'Shade cloth')}${cb('setup.covered', su.covered, 'Covered area')}${cb('setup.polyhouse', su.polyhouse, 'Polyhouse')}${cb('setup.dryer', su.dryer, 'Mechanical dryer')}</div>
        ${heading('Processes you run')}
        <div class="card space-y-2">${METHODS.filter(x => x.id !== 'Other').map(x => `<label class="chk-lg"><input type="checkbox" ${S.processes.includes(x.id) ? 'checked' : ''} onchange="toggleProcess('${x.id}', this.checked)"> ${x.id}</label>`).join('')}</div>
        ${heading('Tools')}
        <div class="card space-y-2">${cb('thermometer', S.thermometer, 'I have a probe thermometer')}${cb('extraInstruments', S.extraInstruments, 'I measure Brix and tank pressure')}</div>
        ${heading('Cultivars')}
        <p class="text-sm text-coffee-400 mb-2">Add the best altitude for each from the <a class="underline" href="${WCR_URL}" target="_blank" rel="noopener">World Coffee Research catalog</a>. The app warns when a farm is lower.</p>
        <div class="space-y-2">${state.cultivars.map((c, i) => `<div class="card !p-3 space-y-2">
          <div class="flex gap-2"><input value="${esc(c.name)}" class="field-lg" onchange="setCultivar(${i},'name',this.value)"><button onclick="removeCultivar(${i})" class="text-coffee-500 px-2" title="Remove"><i data-lucide="x" class="w-5 h-5"></i></button></div>
          <div class="grid grid-cols-2 gap-2"><input type="number" inputmode="numeric" value="${c.optMin ?? ''}" placeholder="Best from (m)" class="field-lg" onchange="setCultivar(${i},'optMin',num(this.value))"><input type="number" inputmode="numeric" value="${c.optMax ?? ''}" placeholder="to (m)" class="field-lg" onchange="setCultivar(${i},'optMax',num(this.value))"></div>
          ${c.flavor ? `<div class="inline-why text-sm text-coffee-300">${esc(c.flavor)}.${why(c.flavorRef)}</div>` : ''}
        </div>`).join('')}</div>
        <button onclick="addCultivar()" class="btn-big ghost mt-2"><i data-lucide="plus" class="w-5 h-5"></i> Add cultivar</button>`;
    }

    function renderSources() {
      const S = state.settings;
      const cols = ['lucia', 'research', 'toolkit', 'tool'];
      const rows = Object.entries(THRESHOLDS).map(([k, t]) => {
        const r = resolve(k);
        return `<div class="card !p-3 space-y-1">
          <div class="flex items-center justify-between gap-3"><div class="text-[15px] text-white">${esc(t.label)}</div><div class="flex items-center gap-1"><input type="number" step="any" value="${S.overrides[k] ?? ''}" placeholder="${r.v}" class="field !w-20 text-right" onchange="setOverride('${k}', this.value)"><span class="text-sm text-coffee-400 w-10">${esc(t.unit)}</span></div></div>
          <div class="text-xs text-coffee-400">${cols.filter(c => t[c]).map(c => `<span class="${r.from === c ? 'text-amber-300' : ''}">${SOURCE_NAMES[c]}: ${t[c][0]}${t[c][1] ? ` (${esc(t[c][1])})` : ''}</span>`).join(' · ')}${r.from === 'you' ? ' · <span class="text-amber-300">Yours</span>' : ''}</div>
        </div>`;
      }).join('');
      return `<div class="card space-y-2">
          <div class="text-white font-semibold">Whose numbers to use</div>
          <select onchange="setPreset(this.value)" class="field-lg"><option value="lucia" ${S.preset === 'lucia' ? 'selected' : ''}>Lucia Solis (default)</option><option value="research" ${S.preset === 'research' ? 'selected' : ''}>Research papers</option></select>
          <p class="text-sm text-coffee-400">When a source has no number for something, the next one fills the gap. "Tool heuristic" values are my starting points, not published rules. Type your own value in the box to override any of them.</p>
        </div>
        <div class="space-y-2 mt-3">${rows}</div>`;
    }

    function renderAlertsPage() {
      const perm = 'Notification' in window ? Notification.permission : 'unsupported';
      return `<div class="card space-y-3">
          <div class="text-white font-semibold">Phone calendar</div>
          <p class="text-[15px] text-coffee-300">Adds the next 48 hours of reminders to your calendar, so your phone rings even when this page is closed. Add it again when the weather changes.</p>
          <button onclick="exportIcs()" class="btn-big"><i data-lucide="calendar-plus" class="w-5 h-5"></i> Add to calendar</button>
        </div>
        <div class="card space-y-3 mt-3">
          <div class="text-white font-semibold">Alerts while the page is open</div>
          <p class="text-[15px] text-coffee-300">${perm === 'granted' ? 'On.' : perm === 'denied' ? 'Blocked in the browser settings.' : perm === 'unsupported' ? 'This browser does not support alerts.' : 'Off.'}</p>
          ${perm === 'default' ? '<button onclick="enableNotifications()" class="btn-big ghost">Turn on alerts</button>' : ''}
        </div>`;
    }

    function renderDataPage() {
      return `<div class="card space-y-3">
          <p class="text-[15px] text-coffee-300">Lots are saved on this phone only. Make a backup now and then.</p>
          <button onclick="exportJson()" class="btn-big ghost"><i data-lucide="download" class="w-5 h-5"></i> Back up</button>
          <label class="btn-big ghost cursor-pointer"><i data-lucide="upload" class="w-5 h-5"></i> Restore a backup<input type="file" accept=".json,application/json" class="hidden" onchange="importJson(this)"></label>
          <button onclick="exportCsv()" class="btn-big ghost"><i data-lucide="sheet" class="w-5 h-5"></i> Export for a spreadsheet (CSV)</button>
        </div>
        <div class="card space-y-3 mt-3">
          <p class="text-[15px] text-coffee-300">Sample lots come from the batch tracker spreadsheet. They show how lots look at each stage.</p>
          <button onclick="loadSamples()" class="btn-big ghost"><i data-lucide="sparkles" class="w-5 h-5"></i> Add sample lots</button>
          <button onclick="removeSamples()" class="btn-big ghost"><i data-lucide="eraser" class="w-5 h-5"></i> Remove sample lots</button>
          <button onclick="clearAll()" class="text-sm text-rose-300 underline">Delete everything</button>
        </div>`;
    }

    const CALC_HTML = `<div class="space-y-4">
        <div class="card space-y-3">
          <div class="text-white font-semibold">Yeast dose</div>
          <div class="grid grid-cols-2 gap-2">
            <div><div class="text-sm text-coffee-300 mb-1">Coffee into tank (kg)</div><input id="c_kg" type="number" min="0" value="500" class="field-lg" oninput="renderCalc()"></div>
            <div><div class="text-sm text-coffee-300 mb-1">Dose (g/kg)</div><input id="c_dose" type="number" min="0" step="0.1" class="field-lg" oninput="renderCalc()"></div>
            <div><div class="text-sm text-coffee-300 mb-1">Culture</div><select id="c_yeast" class="field-lg" onchange="renderCalc()"></select></div>
            <div><div class="text-sm text-coffee-300 mb-1">Container</div><select id="c_container" class="field-lg" onchange="renderCalc()"><option value="barrel">Barrels (40–45 kg)</option><option value="tank">One tank</option></select></div>
          </div>
          <div id="calcDoseOut" class="text-sm space-y-2"></div>
        </div>
        <div class="card space-y-3">
          <div class="text-white font-semibold">Target weight</div>
          <p class="text-sm text-coffee-400">Dry matter stays the same while coffee dries. Once the meter gives a steady reading, one weighing tells you what the lot will weigh at the target.</p>
          <div class="grid grid-cols-2 gap-2">
            <div><div class="text-sm text-coffee-300 mb-1">Weight now (kg)</div><input id="m_w0" type="number" step="0.01" value="100" class="field-lg" oninput="renderCalc()"></div>
            <div><div class="text-sm text-coffee-300 mb-1">Meter now (%)</div><input id="m_m0" type="number" step="0.1" value="20" class="field-lg" oninput="renderCalc()"></div>
            <div><div class="text-sm text-coffee-300 mb-1">Later weight (kg)</div><input id="m_w1" type="number" step="0.01" value="95" class="field-lg" oninput="renderCalc()"></div>
            <div><div class="text-sm text-coffee-300 mb-1">Target (%)</div><input id="m_target" type="number" step="0.1" class="field-lg" oninput="renderCalc()"></div>
          </div>
          <div id="calcMoistOut" class="text-sm space-y-2"></div>
        </div>
      </div>`;

    // ---------------------------------------------------------------
    // NAVIGATION & RENDER
    // ---------------------------------------------------------------
    const PAGES = {
      today: { title: 'Today', nav: 'today' },
      new: { title: 'New lot', nav: 'new', back: 'wizard' },
      lots: { title: 'Lots', nav: 'lots' },
      lot: { title: 'Lot', nav: 'lots', back: 'lots' },
      more: { title: 'More', nav: 'more' },
      recipes: { title: 'Your recipes', nav: 'more', back: 'more' },
      refs: { title: 'What other mills did', nav: 'more', back: 'more' },
      settings: { title: 'Mill and setup', nav: 'more', back: 'more' },
      alerts: { title: 'Reminders on your phone', nav: 'more', back: 'more' },
      sources: { title: 'Where the numbers come from', nav: 'more', back: 'more' },
      calc: { title: 'Calculators', nav: 'more', back: 'more' },
      data: { title: 'Backup and sample data', nav: 'more', back: 'more' },
    };
    function setPreset(v) { state.settings.preset = v; wxCache = null; save(); renderAll(); }
    function setTab(tab) {
      if (tab === 'new' && !wiz) wiz = { step: 0, d: newDraft(), err: '' };
      state.tab = PAGES[tab] ? tab : 'today';
      save(); renderAll(); window.scrollTo({ top: 0 });
    }
    function goBack() {
      const p = PAGES[state.tab];
      if (p.back === 'wizard') { if (wiz && wiz.step > 0) { wiz.step--; wiz.err = ''; renderAll(); window.scrollTo({ top: 0 }); } else { wiz = null; setTab('today'); } return; }
      setTab(p.back || 'today');
    }
    function renderHeader() {
      const p = PAGES[state.tab];
      const m = state.settings.mill;
      const l = state.tab === 'lot' ? lotById(state.selectedId) : null;
      document.getElementById('pageTitle').textContent = p.title;
      document.getElementById('millName').textContent = state.tab === 'today' ? (m.name || 'Mill Assistant') : '';
      document.getElementById('millName').classList.toggle('hidden', state.tab !== 'today');
      document.getElementById('backBtn').classList.toggle('hidden', !p.back);
      document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('on', b.dataset.nav === p.nav));
    }
    function renderAll() {
      const t = state.tab;
      if (t === 'lot' && !lotById(state.selectedId)) state.tab = 'lots';
      renderHeader();
      const el = document.getElementById('view');
      const pages = { today: renderToday, new: renderWizard, lots: renderLots, lot: renderLot, more: renderMore, recipes: renderRecipesPage, refs: renderRefs, settings: renderSettingsPage, alerts: renderAlertsPage, sources: renderSources, calc: () => CALC_HTML, data: renderDataPage };
      el.innerHTML = pages[state.tab]();
      if (state.tab === 'calc') renderCalc();
      icons();
    }

    load();
    if (!PAGES[state.tab] || state.tab === 'new') state.tab = 'today';
    renderAll();
    // Refresh the forecast when it's older than 3 hours and there is signal
    if (state.settings.mill.lat != null && (!state.weather || hoursBetween(state.weather.fetchedAt, new Date()) > 3)) fetchWeather();
    // Keep Today current, but never while someone is typing
    setInterval(() => {
      tickNotifications();
      const a = document.activeElement;
      if (state.tab === 'today' && !(a && /INPUT|SELECT|TEXTAREA/.test(a.tagName))) renderAll();
    }, 60000);
  </script>
</body>
